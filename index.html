<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inspección Cintas · MSMIN</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0b2545">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inspección Cintas">
  <script src="config.js"></script>
  <script src="sesion.js"></script>
  <script src="funciones.js"></script>
  <script>window.PUENTE = { modulo: 'GENERAL', app: 'inicio', sinNav: true, sinLogin: true };</script>
  <script src="puente.js"></script>
  <script src="preparar.js"></script>
  <script src="marco.js"></script>
  <link rel="stylesheet" href="tema.css">
  <style>
    :root { --navy:#0b2545; --azul:#2F5597; --azul-claro:#DAE3F3; --fondo:#EEF1F5; --texto:#1d2330; --muted:#5f6b7a; --rojo:#C00000; --radio:10px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.4 "Segoe UI", Roboto, Calibri, Arial, sans-serif; }
    .marca { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #fff; border-bottom: 4px solid var(--azul); padding: 10px 16px; }
    .marca img { height: 40px; width: auto; display: block; }
    .marca .tit { flex: 1; text-align: center; line-height: 1.2; }
    .marca .tit b { display: block; color: var(--navy); font-size: 16px; letter-spacing: .3px; text-transform: uppercase; }
    .marca .tit small { color: var(--muted); font-size: 12px; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    .caja { background: #fff; border-radius: var(--radio); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 4px 14px rgba(0,0,0,.06); padding: 16px; margin-bottom: 14px; }
    h2 { margin: 0 0 12px; font-size: 17px; color: var(--navy); }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: .3px; margin: 10px 0 4px; }
    input, select { width: 100%; padding: 11px 12px; border: 1px solid #9AA4B2; border-radius: 8px; font: inherit; background: #fff; }
    input:focus, select:focus { outline: 2px solid var(--azul); outline-offset: -1px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--azul); background: #fff; color: var(--azul); padding: 10px 14px; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    .btn.pri { background: var(--azul); color: #fff; width: 100%; margin-top: 14px; padding: 12px; }
    .btn.sm { padding: 6px 10px; font-size: 13px; }
    .hint { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
    .error { color: var(--rojo); font-weight: 600; margin-top: 10px; min-height: 1em; }
    .usuario { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .usuario .quien { flex: 1; min-width: 180px; }
    .usuario .quien small { display: block; color: var(--muted); }
    .badge { display: inline-block; border-radius: 4px; padding: 1px 8px; font-size: 11.5px; font-weight: 700; border: 1px solid rgba(0,0,0,.15); }
    .b-ADMIN { background: #1F3864; color: #fff; } .b-EDITOR { background: #92D050; } .b-LECTOR { background: #FFF4CE; } .b-NINGUNO { background: #eee; color: #888; }
    .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .app { background: #fff; border-radius: var(--radio); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 4px 14px rgba(0,0,0,.06); overflow: hidden; cursor: pointer; border: 2px solid transparent; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
    .app:hover, .app:focus { border-color: var(--azul); }
    .app .cab { background: var(--azul); color: #fff; padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .app .cab b { font-size: 15.5px; }
    .app .cab span { font-size: 22px; }
    .app .cuerpo { padding: 10px 14px 12px; font-size: 13.5px; flex: 1; }
    .app .pie { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 6px; flex-wrap: wrap; }
    .app.local .cab { background: var(--navy); }
    .app.admin .cab { background: #1F3864; }
    .app.bloq { opacity: .5; cursor: not-allowed; }
    .etq { font-size: 11px; color: var(--muted); }
    .perfil { display: flex; gap: 10px; align-items: flex-start; text-transform: none; font-weight: 400; letter-spacing: 0; font-size: 14px; color: var(--texto); border: 1px solid #d5dbe3; border-radius: 8px; padding: 10px; margin: 6px 0; cursor: pointer; }
    .perfil input { width: auto; margin-top: 3px; }
    .perfil small { color: var(--muted); }
    .sinsenal { background: #FFF4CE; border: 1px solid #FFC000; color: #7a5a00; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; display: none; }
    html.ic-esc .marca { display: none; }
    html.ic-esc main { max-width: 1180px; padding: 28px 32px; }
    @media (max-width: 520px) { .marca img { height: 30px; } .marca .tit b { font-size: 13px; } .marca .tit small { display: none; } main { padding: 12px; } }
  </style>
</head>
<body>
  <div class="marca">
    <img src="icons/logo-msmin.jpg" alt="MSMIN by SGS">
    <div class="tit"><b>Inspección Cintas</b><small>Gestión de Cintas Transportadoras · Área Seca GEL</small></div>
    <img src="icons/logo-codelco.jpg" alt="Codelco">
  </div>
  <main id="vista"></main>

<script>
var ICON = { MAPEO: '🗺️', ESPESORES: '📏', SEMANAL: '📅', INSPECCION: '📋', FLASH: '⚡', CHECKLIST: '✅' };
var DESC = {
  CHECKLIST: 'Inspección previa (46 ítems con fotos) y verificación post mantenimiento, con PDF.',
  MAPEO: 'Ficha técnica, tramos, hallazgos y diagrama de cada cinta.',
  ESPESORES: 'Muestreos de espesor, desgaste y proyección de cambio.',
  SEMANAL: 'Reporte semanal de cintas y focos de aseo.',
  INSPECCION: 'Pauta de inspección visual por equipo.',
  FLASH: 'Desviaciones operacionales y pérdida estimada.'
};
var PAGINA = { MAPEO: 'mapeo.html', ESPESORES: 'espesores.html', SEMANAL: 'semanal.html', INSPECCION: 'pauta.html', FLASH: 'flash.html', CHECKLIST: 'checklist.html' };
var NOMBRE_ROL = { ADMIN: 'Administrador', EDITOR: 'Usuario', LECTOR: 'Visualizador', NINGUNO: 'Sin acceso' };
var $ = function (s) { return document.querySelector(s); };
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function badge(r) { return '<span class="badge b-' + esc(r) + '">' + esc(NOMBRE_ROL[r] || r) + '</span>'; }
function volverA() { var m = /[?&]volver=([^&]+)/.exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }

function pintarLogin(msg) {
  if (window.MARCO) MARCO.refrescar();
  $('#vista').innerHTML =
    '<div class="caja" style="max-width:420px;margin:20px auto">' +
    '<h2>Iniciar sesión</h2>' +
    '<label for="inEmail">Correo</label><input id="inEmail" type="email" autocomplete="username" inputmode="email" placeholder="nombre@empresa.cl">' +
    '<label for="inPin">PIN</label><input id="inPin" type="password" autocomplete="current-password" placeholder="PIN entregado por el administrador">' +
    '<button class="btn pri" id="bEntrar">Entrar</button>' +
    '<div class="error" id="err">' + esc(msg || '') + '</div>' +
    '<div class="hint">Se pide una sola vez en este teléfono (dura 90 días).</div>' +
    '<button class="btn" id="bCrear" style="width:100%;margin-top:14px">¿No tiene cuenta? Crear cuenta</button></div>';
  $('#inEmail').value = SESION_APP.email();
  $('#bEntrar').onclick = entrar;
  $('#bCrear').onclick = function () { pintarRegistro(); };
  $('#inPin').onkeydown = function (e) { if (e.key === 'Enter') entrar(); };
  (SESION_APP.email() ? $('#inPin') : $('#inEmail')).focus();
}

function pintarRegistro(msg) {
  $('#vista').innerHTML =
    '<div class="caja" style="max-width:460px;margin:20px auto">' +
    '<h2>Crear cuenta</h2>' +
    '<label>¿Qué necesita hacer en la app?</label>' +
    '<label class="perfil"><input type="radio" name="perfil" value="VISUALIZADOR" checked> <span><b>Ver y descargar</b> (Visualizador)<br><small>Entra al tiro. Ve fichas, reportes e informes y descarga PDF.</small></span></label>' +
    '<label class="perfil"><input type="radio" name="perfil" value="USUARIO"> <span><b>Registrar y guardar</b> (Usuario)<br><small>Le llega un correo para confirmar y luego un administrador aprueba. Mientras tanto puede ver.</small></span></label>' +
    '<label for="rNombre">Nombre y apellido</label><input id="rNombre" autocomplete="name">' +
    '<label for="rEmail">Correo</label><input id="rEmail" type="email" inputmode="email" autocomplete="email" placeholder="nombre@empresa.cl">' +
    '<label for="rEmpresa">Empresa</label><input id="rEmpresa" placeholder="MSMIN, Codelco, contratista…">' +
    '<label for="rCargo">Cargo</label><input id="rCargo" placeholder="Supervisor, mantenedor, inspector…">' +
    '<label for="rPin">Elija un PIN (4 a 20 caracteres)</label><input id="rPin" type="password" autocomplete="new-password">' +
    '<label for="rPin2">Repita el PIN</label><input id="rPin2" type="password" autocomplete="new-password">' +
    '<button class="btn pri" id="bRegistrar">Crear cuenta</button>' +
    '<div class="error" id="err">' + esc(msg || '') + '</div>' +
    '<button class="btn" id="bVolver" style="width:100%;margin-top:10px">Ya tengo cuenta: entrar</button></div>';
  $('#bVolver').onclick = function () { pintarLogin(); };
  $('#bRegistrar').onclick = registrar;
  $('#rNombre').focus();
}

function registrar() {
  var d = { nombre: $('#rNombre').value.trim(), email: $('#rEmail').value.trim(), empresa: $('#rEmpresa').value.trim(), cargo: $('#rCargo').value.trim(),
            pin: $('#rPin').value.trim(), perfil: (document.querySelector('input[name=perfil]:checked') || {}).value };
  var err = function (m) { $('#err').textContent = m; };
  if (d.nombre.length < 3) return err('Escriba su nombre y apellido.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return err('Escriba un correo válido.');
  if (!/^\S{4,20}$/.test(d.pin)) return err('El PIN debe tener entre 4 y 20 caracteres, sin espacios.');
  if (d.pin !== $('#rPin2').value.trim()) return err('Los PIN no coinciden.');
  if (!navigator.onLine) return err('Para crear la cuenta se necesita señal.');
  $('#bRegistrar').disabled = true; $('#bRegistrar').textContent = 'Creando…';
  SESION_APP.registrar(d).then(function (r) {
    if (!r.ok) { $('#bRegistrar').disabled = false; $('#bRegistrar').textContent = 'Crear cuenta'; return err(r.mensaje || 'No se pudo crear la cuenta.'); }
    if (r.reenviado) { pintarLogin(r.mensaje); return; }
    alert(r.mensaje);
    PREPARAR.siCorresponde();
    cargarMenu();
  }, function (e) { $('#bRegistrar').disabled = false; $('#bRegistrar').textContent = 'Crear cuenta'; err('No se pudo conectar: ' + e.message); });
}

function entrar() {
  var email = $('#inEmail').value.trim(), pin = $('#inPin').value.trim();
  if (!email || !pin) { $('#err').textContent = 'Ingrese su correo y PIN.'; return; }
  $('#bEntrar').disabled = true; $('#bEntrar').textContent = 'Verificando…';
  SESION_APP.iniciar(email, pin).then(function (r) {
    if (!r.ok) { pintarLogin(r.mensaje || 'Correo o PIN incorrecto.'); return; }
    PREPARAR.siCorresponde();                       // primera descarga, sola, apenas entra
    var v = volverA();
    if (v) location.href = v; else cargarMenu();
  }, function (e) {
    pintarLogin(navigator.onLine ? ('No se pudo conectar: ' + e.message) : 'Sin señal: para iniciar sesión la primera vez se necesita internet.');
  });
}

function cargarMenu() {
  var guardado = null;
  try { guardado = JSON.parse(localStorage.getItem('ic_inicio') || 'null'); } catch (e) { }
  if (guardado) pintarMenu(guardado, !navigator.onLine);
  else $('#vista').innerHTML = '<div class="caja">Cargando actividades…</div>';
  SESION_APP.llamar('inicioDatos', []).then(function (d) {
    try { localStorage.setItem('ic_inicio', JSON.stringify(d)); } catch (e) { }
    pintarMenu(d, false);
  }, function (e) {
    if (e.sinSesion) { pintarLogin(e.message); return; }
    if (guardado) pintarMenu(guardado, true);
    else $('#vista').innerHTML = '<div class="caja"><h2>Sin conexión</h2>Abra la app una vez con señal para descargar el menú.<br><br><a class="btn" href="checklist.html">✅ Abrir Checklist igual</a></div>';
  });
}

function pintarMenu(d, sinSenal) {
  var s = d.sesion || {}, base = SESION_APP.url();
  if (window.MARCO) {
    var perm = {}; (d.modulos || []).forEach(function (m) { perm[m.id] = m.rol; });
    MARCO.pintar({ nombre: s.nombre || s.email || SESION_APP.email(), email: s.email || SESION_APP.email(), rol: s.rol || 'LECTOR', modulos: perm, sinSenal: !!sinSenal, area: ((d.areas || []).filter(function (x) { return x.area === d.area; })[0] || {}).nombre || d.area || '' });
  }
  var h = '<div class="sinsenal" id="avisoSenal" style="display:' + (sinSenal ? 'block' : 'none') + '">📵 Sin señal: todas las actividades funcionan con lo guardado en el teléfono. Lo que registre se enviará solo al volver la señal.</div>';
  h += '<div class="caja usuario"><div class="quien">👤 <b>' + esc(s.nombre || s.email || SESION_APP.email()) + '</b> ' + badge(s.rol || 'LECTOR') +
       '<small>' + esc(s.email || SESION_APP.email()) + (d.area ? ' · ' + esc(d.area) : '') + '</small></div>';
  if ((d.areas || []).length > 1) {
    h += '<select id="selArea" style="width:auto">' + d.areas.map(function (a) { return '<option value="' + esc(a.area) + '"' + (a.area === d.area ? ' selected' : '') + '>' + esc(a.nombre) + '</option>'; }).join('') + '</select>';
  }
  h += '<button class="btn sm" id="bSalir">Cerrar sesión</button></div>';
  var SOL = { CORREO_PENDIENTE: '📧 Pidió el perfil <b>Usuario</b>: abra el correo que le enviamos a ' + esc(s.email) + ' y toque <b>Confirmar mi correo</b> (revise también Spam). Mientras tanto puede ver y descargar.',
              APROBACION_PENDIENTE: '⏳ Su correo está confirmado. Falta que un administrador apruebe su perfil <b>Usuario</b>; le llegará un correo. Mientras tanto puede ver y descargar.',
              RECHAZADA: 'Su solicitud de perfil Usuario no fue aprobada. Sigue como Visualizador.' };
  if (SOL[s.solicitud]) h += '<div class="caja" style="border-left:5px solid #FFC000">' + SOL[s.solicitud] + '</div>';

  var mods = (d.modulos || []).slice().sort(function (a, b) { return (a.id === 'CHECKLIST' ? -1 : 0) - (b.id === 'CHECKLIST' ? -1 : 0); });
  h += preparadoHtml(sinSenal);
  h += '<div class="apps">' + mods.map(function (m) {
    var bloq = m.rol === 'NINGUNO';
    return '<a class="app' + (m.id === 'CHECKLIST' ? ' local' : '') + (bloq ? ' bloq' : '') + '" href="' + (bloq ? '#' : (PAGINA[m.id] || '#')) + '" data-bloq="' + (bloq ? 1 : 0) + '">' +
      '<div class="cab"><b>' + esc(m.nombre) + '</b><span>' + (ICON[m.id] || '•') + '</span></div>' +
      '<div class="cuerpo">' + esc(DESC[m.id] || '') + '<div class="pie">' + badge(m.rol) +
      '<span class="etq">Con y sin señal</span></div></div></a>';
  }).join('') +
    '<a class="app admin" href="admin.html?tab=equipos">' +
    '<div class="cab"><b>Catálogo de equipos</b><span>🏭</span></div><div class="cuerpo">Ficha técnica única de cada equipo y cinta: la usan todas las apps e informes.' +
    (s.rol === 'ADMIN' ? ' Usted puede modificarla.' : ' Solo los administradores la modifican.') +
    '<div class="pie">' + badge(s.rol || 'LECTOR') + '<span class="etq">Con y sin señal</span></div></div></a>' +
    '<a class="app admin" href="admin.html?tab=ots">' +
    '<div class="cab"><b>OT semanales</b><span>📅</span></div><div class="cuerpo">Cargue cada semana las OT: la Pauta de inspección y la Medición de espesores las toman solas.' +
    '<div class="pie">' + badge(s.rol || 'LECTOR') + '<span class="etq">Guardar requiere señal</span></div></div></a>' +
    '<a class="app admin" href="admin.html">' +
    '<div class="cab"><b>Administración</b><span>⚙️</span></div><div class="cuerpo">Informes para descargar' +
    (s.rol === 'ADMIN' ? ', equipos, datos y usuarios con sus perfiles' : (s.rol === 'EDITOR' ? ' y corrección de datos' : '')) + '.' +
    '<div class="pie">' + badge(s.rol || 'LECTOR') + '<span class="etq">Cambios y PDF requieren señal</span></div></div></a></div>';
  h += '<div class="hint">Sin señal: lo que registre queda guardado en el teléfono y se envía solo cuando vuelve la señal. ' +
       'Lo que ve sin señal es lo descargado en la última preparación.</div>';
  $('#vista').innerHTML = h;
  if ($('#bPreparar')) $('#bPreparar').onclick = function () { preparar(true); };
  $('#bSalir').onclick = function () { if (confirm('¿Cerrar sesión en este teléfono?')) { SESION_APP.cerrar(); pintarLogin(); } };
  if ($('#selArea')) $('#selArea').onchange = function () { SESION_APP.elegirArea(this.value); cargarMenu(); };
  Array.prototype.forEach.call(document.querySelectorAll('.app[data-bloq="1"]'), function (a) {
    a.onclick = function (e) { e.preventDefault(); alert('Su usuario no tiene acceso a esta actividad.'); };
  });
  cargarCumplimiento(d);
}

/* ---------- Cumplimiento semanal (tarjeta compacta de Inicio). La misma función está copiada en pwa2/index.html ---------- */
function cumplTarjeta(c, enlace) {
  if (!document.getElementById('cuCss')) {
    var st = document.createElement('style'); st.id = 'cuCss';
    st.textContent = '#cajaCumpl{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:12px}' +
      '.cu-tit{flex:1;min-width:180px}.cu-tit b{color:#0b2545;font-size:15px}.cu-tit small{display:block;color:#5f6b7a;font-size:12px}' +
      '.cu-kpi2{display:flex;align-items:center;gap:8px;border:1px solid #E1E6ED;border-radius:10px;padding:6px 12px;white-space:nowrap}' +
      '.cu-kpi2 span{font-size:13px;color:#1d2330}.cu-kpi2 b{font-size:20px;font-variant-numeric:tabular-nums}.cu-kpi2 small{color:#5f6b7a;font-size:12px}' +
      '.cu-kpi2 i{width:10px;height:10px;border-radius:50%;display:inline-block}' +
      '@media (max-width:520px){.cu-kpi2{flex:1}}';
    document.head.appendChild(st);
  }
  var S = c.semanas || [], w = S[S.length - 1];
  if (!w) return '';
  function color(p) { return p === null ? '#9AA4B2' : p >= 90 ? '#2E7D32' : p >= 60 ? '#E0A100' : '#C62828'; }
  function kpi(nom, x) {
    return '<div class="cu-kpi2" title="' + (x.prog ? x.hechas + ' de ' + x.prog + ' programadas' : 'Sin programa esta semana') + '"><i style="background:' + color(x.prog ? x.pct : null) + '"></i>' +
      '<span>' + nom + '</span><b>' + (x.prog ? x.pct + '%' : '—') + '</b><small>' + (x.prog ? x.hechas + '/' + x.prog : '') + '</small></div>';
  }
  var actual = c.hoy && w.anio === c.hoy.anio && w.semana === c.hoy.semana;
  return '<div class="caja" id="cajaCumpl"><div class="cu-tit"><b>📊 Cumplimiento ' + w.etiqueta + '</b><small>' + (actual ? 'Semana actual' : 'Semana ' + w.anio) + '</small></div>' +
    kpi('📋 Pauta', w.insp) + kpi('📏 Espesores', w.esp) +
    (enlace ? '<a class="btn sm" href="' + enlace + '"' + (enlace.charAt(0) === '#' ? ' data-cupanel="1"' : '') + '>Ver detalle</a>' : '') + '</div>';
}

/** Tarjeta de cumplimiento: se muestra al tiro la última copia y se actualiza con señal. */
function cargarCumplimiento(d) {
  var mi = (d.modulos || []).filter(function (m) { return m.id === 'INSPECCION'; })[0];
  if (!mi || mi.rol === 'NINGUNO') return;
  var poner = function (c) {
    var html = c && cumplTarjeta(c, 'admin.html?tab=cumpl'), apps = document.querySelector('.apps');
    if (!html || !apps) return;
    var v = document.getElementById('cajaCumpl'); if (v) v.remove();
    apps.insertAdjacentHTML('afterend', html);
  };
  try { poner(JSON.parse(localStorage.getItem('ic_cumpl') || 'null')); } catch (e) { }
  if (!navigator.onLine || Date.now() - (window.__cuPedido || 0) < 60000) return;
  window.__cuPedido = Date.now();
  SESION_APP.llamar('cumplimiento', ['', '', 1]).then(function (c) {
    try { localStorage.setItem('ic_cumpl', JSON.stringify(c)); } catch (e) { }
    poner(c);
  }, function () { });
}

/* ---------------- Datos para trabajar sin señal (preparar.js) ---------------- */
function textoPreparado() {
  var ult = PREPARAR.ultima();
  return ult ? 'Actualizados: ' + new Date(ult).toLocaleString('es-CL') + ' · se actualizan solos con señal' : 'Aún no se descargan en este teléfono';
}
function preparadoHtml(sinSenal) {
  return '<div class="caja" id="cajaPrep" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
    '<div style="flex:1;min-width:200px">📥 <b>Datos para trabajar sin señal</b><br><small class="etq" id="txtPrep">' + textoPreparado() + '</small></div>' +
    (sinSenal ? '' : '<button class="btn sm" id="bPreparar" title="No es necesario: se actualiza solo">Actualizar ahora</button>') + '</div>';
}
function txtPrep(msg) { var e = document.getElementById('txtPrep'); if (e) e.textContent = msg; }
function preparar(manual) {
  if (PREPARAR.enCurso()) { if (manual) txtPrep('Ya se está actualizando…'); return; }
  if ($('#bPreparar')) $('#bPreparar').disabled = true;
  PREPARAR.ejecutar({ completo: true, alAvanzar: function (n, tot) { txtPrep('Descargando… ' + n + ' de ' + tot); } }).then(function (r) {
    if ($('#bPreparar')) $('#bPreparar').disabled = false;
    txtPrep(textoPreparado() + (r && r.fallidas ? ' · ' + r.fallidas + ' sin respuesta' : ''));
    if (manual && r) alert('Listo: los datos quedaron guardados en el teléfono para trabajar sin señal.');
  });
}
document.addEventListener('ic-preparado', function () { txtPrep(textoPreparado()); });
window.PREPARAR_AVANCE = function (n, tot) { txtPrep('Actualizando datos para trabajar sin señal… ' + n + ' de ' + tot); };

window.addEventListener('online', function () { var a = $('#avisoSenal'); if (a && SESION_APP.token()) cargarMenu(); });
window.addEventListener('offline', function () { var a = $('#avisoSenal'); if (a) a.style.display = 'block'; });

var PAG_APP = { mapeo: 'mapeo.html', espesores: 'espesores.html', semanal: 'semanal.html', pauta: 'pauta.html', flash: 'flash.html', checklist: 'checklist.html', admin: 'admin.html' };
var appPedida = (/[?&]app=([^&]+)/.exec(location.search) || [])[1];
if (appPedida && PAG_APP[appPedida]) location.replace(PAG_APP[appPedida] + location.search.replace(/[?&]app=[^&]+/, '').replace(/^&/, '?'));
else if (!SESION_APP.url()) {
  $('#vista').innerHTML = '<div class="caja"><h2>Falta configurar la app</h2>Edite <b>config.js</b> en GitHub y pegue la URL de la implementación de Gestión Cintas (termina en /exec).</div>';
} else if (SESION_APP.token()) {
  var v0 = volverA();
  if (v0) location.replace(v0); else cargarMenu();
} else {
  pintarLogin();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
}
</script>
</body>
</html>
