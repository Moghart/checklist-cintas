<style>
:root{
  --azul:#27408B; --azul-osc:#1B2D66; --azul-suave:#E8ECF7; --naranja:#E8590C; --naranja-suave:#FDEBDD;
  --fondo:#F3F5F9; --tarjeta:#FFFFFF; --linea:#D5DAE5; --texto:#172033; --tenue:#5A6478;
  --ok:#1E8E4E; --ok-suave:#E3F4EA; --alerta:#B26A00; --alerta-suave:#FFF3D6; --critico:#C62828; --critico-suave:#FDE7E7;
  --radio:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.cab{background:var(--tarjeta);border-bottom:3px solid var(--naranja);position:sticky;top:0;z-index:20}
.cab-in{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cab img{height:38px;width:auto;display:block}
.cab h1{font-size:17px;margin:0;color:var(--azul-osc);flex:1;min-width:150px;font-weight:700}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--azul-suave);color:var(--azul-osc);border:0;cursor:pointer;font-weight:600}
.estado i{width:9px;height:9px;border-radius:50%;background:var(--tenue);display:inline-block}
.estado.on i{background:var(--ok)} .estado.off i{background:var(--critico)} .estado.pend{background:var(--alerta-suave);color:#6B4100}
nav{background:var(--azul);}
nav .in{max-width:1120px;margin:0 auto;display:flex;padding:0 8px}
nav button{flex:1;max-width:220px;background:none;border:0;color:#C9D2EE;padding:11px 8px;font-weight:600;font-size:15px;border-bottom:3px solid transparent;cursor:pointer}
nav button.act{color:#fff;border-bottom-color:var(--naranja)}
main{max-width:1120px;margin:0 auto;padding:14px 16px 90px}
.tar{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:14px 16px;margin-bottom:14px}
.tar h2{font-size:16px;margin:0 0 10px;color:var(--azul-osc);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.paso{background:var(--azul);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.campo label{display:block;font-size:12.5px;color:var(--tenue);font-weight:600;margin-bottom:3px}
.campo input,.campo select{width:100%;padding:10px;border:1px solid #AEB6C8;border-radius:8px;background:#fff;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:3px solid #9DB2F2;outline-offset:1px}
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;margin-top:10px}
.ficha div{font-size:14px} .ficha span{display:block;font-size:11.5px;color:var(--tenue);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.auto{font-size:12px;color:var(--tenue);font-weight:500}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.chip.BAJA,.chip.ok{background:var(--ok-suave);color:#12613A} .chip.MEDIA,.chip.pend{background:var(--alerta-suave);color:#6B4100} .chip.ALTA,.chip.err{background:var(--critico-suave);color:#8E1B1B} .chip.gris{background:#E9ECF2;color:#3F485B}
.tramos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tramos button{border:1.5px solid var(--linea);background:#fff;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:14px;min-height:44px}
.tramos button.act{border-color:var(--azul);background:var(--azul-suave);color:var(--azul-osc)}
.tramos small{display:block;font-weight:500;color:var(--tenue);font-size:12px}
.seg{display:inline-flex;border:1.5px solid var(--azul);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 16px;font-weight:600;cursor:pointer;color:var(--azul-osc);min-height:42px}
.seg button.act{background:var(--azul);color:#fff}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.btn{border:1.5px solid var(--azul);background:#fff;color:var(--azul-osc);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px;font-size:14.5px}
.btn.pri{background:var(--azul);color:#fff} .btn.nar{background:var(--naranja);border-color:var(--naranja);color:#fff}
.btn.gde{padding:13px 20px;font-size:16px} .btn:disabled{opacity:.5;cursor:default} .btn.mini{min-height:34px;padding:5px 10px;font-size:13px}
.zona{font-size:12.5px;font-weight:700;color:var(--tenue);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
.puntos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:760px){.puntos{grid-template-columns:repeat(8,1fr)}}
.pt{border:1.5px solid var(--linea);border-radius:8px;padding:6px 6px 5px;background:#fff;display:flex;flex-direction:column;gap:2px;min-width:0}
.pt .pn{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tenue);font-weight:600}
.pt .pn b{color:var(--azul-osc);font-size:13px}
.pt .pn .ant{white-space:nowrap;font-size:12px;font-weight:700;color:#3F485B;background:#E9ECF2;border-radius:5px;padding:1px 5px;font-variant-numeric:tabular-nums}
.pt.sube .pn .ant{background:var(--alerta);color:#fff}
.pt input{width:100%;border:0;border-bottom:2px solid #AEB6C8;padding:4px 2px;font-size:19px;font-weight:600;text-align:center;background:transparent;border-radius:0;min-width:0;font-variant-numeric:tabular-nums}
.pt input:focus{outline:0;border-bottom-color:var(--azul)}
.pt .pa{font-size:10.5px;color:var(--tenue);text-align:center}
.pt.sube{border-color:var(--alerta);background:var(--alerta-suave)} .pt.crit{border-color:var(--critico);background:var(--critico-suave)} .pt.mal{border-color:var(--critico)}
.pt.aj{border-color:var(--azul);background:var(--azul-suave)}
.pt .ajb{border:0;background:var(--alerta);color:#fff;border-radius:6px;font-size:12px;font-weight:700;padding:5px 2px;cursor:pointer;min-height:30px}
.aviso{border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aviso.al{background:var(--alerta-suave);border:1px solid #E6C36A;color:#5A3A00} .aviso.cr{background:var(--critico-suave);border:1px solid #EBA3A3;color:#7A1515}
.aviso.inf{background:var(--azul-suave);border:1px solid #B9C5EA;color:var(--azul-osc)} .aviso.ok{background:var(--ok-suave);border:1px solid #A5D8BA;color:#0E4F2E}
.aviso span{flex:1;min-width:200px}
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0 4px}
.resumen div{background:var(--fondo);border-radius:8px;padding:8px 10px}
.resumen span{display:block;font-size:11.5px;color:var(--tenue);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.resumen b{font-size:18px;font-variant-numeric:tabular-nums}
.perfil{width:100%;height:auto;display:block;margin-top:8px;background:#fff;border:1px solid var(--linea);border-radius:8px}
.ley{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tenue);margin-top:5px}
.ley i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.obs{display:grid;grid-template-columns:1fr;gap:8px}
.obs .fila{display:grid;grid-template-columns:1fr;gap:6px;border:1px solid var(--linea);border-radius:8px;padding:8px 10px}
@media(min-width:760px){.obs .fila{grid-template-columns:230px 1fr 1fr 1fr;align-items:center}}
.obs .fila.proy{background:var(--azul-suave);border-color:#B9C5EA}
@media(min-width:760px){.obs .fila.proy{grid-template-columns:230px 1fr}}
.obs .fproy b{font-size:18px;font-variant-numeric:tabular-nums;display:block}
.obs .fproy small{color:var(--tenue)}
.obs .tit{font-weight:600;font-size:14px} .obs .tit small{display:block;color:var(--tenue);font-weight:500}
.obs select{width:100%;padding:8px;border:1px solid #AEB6C8;border-radius:8px;background:#fff;min-height:40px;font-size:14px}
.lista{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--linea);border-radius:8px;padding:10px 12px;background:#fff}
.item .d{flex:1;min-width:170px} .item .d b{display:block} .item .d small{color:var(--tenue)}
.pie{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);padding:10px 16px;z-index:15}
.pie .in{max-width:1120px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pie small{color:var(--tenue)}
.modal{position:fixed;inset:0;background:rgba(15,22,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .caja{background:#fff;border-radius:12px;padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px;color:var(--azul-osc)} .modal .acc{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.oculto{display:none!important}
.tenue{color:var(--tenue);font-size:13.5px}
a{color:var(--azul)}
</style>

<script>
/**
 * Calculos.gs — Cálculos de desgaste de cintas transportadoras.
 *
 * Funciones puras (sin acceso a la hoja). Las fechas se manejan como texto
 * 'yyyy-mm-dd' para evitar problemas de zona horaria.
 *
 * Las fórmulas replican las de los libros originales:
 *   - "BI MEDICION DE ESPESORES 2026" (columnas R a CL)
 *   - "Muestra de Medicion" de la planilla de informe (celdas D13:H20)
 */

var N_PUNTOS = 24;

function fechaADia_(iso) {
  var p = String(iso).split('-');
  return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
}

function diaAFecha_(dia) {
  var d = new Date(Math.floor(dia + 1e-9) * 86400000);   // Excel muestra la fecha truncando la fracción de día
  var m = d.getUTCMonth() + 1, dd = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd;
}

/** Igual que NUM.DE.SEMANA(fecha; 2) de Excel: semana que parte en lunes, semana 1 contiene el 1 de enero. */
function numeroSemana_(iso) {
  var dia = fechaADia_(iso);
  var anio = +String(iso).split('-')[0];
  var ene1 = Math.round(Date.UTC(anio, 0, 1) / 86400000);
  var dowLunes0 = (new Date(ene1 * 86400000).getUTCDay() + 6) % 7;
  return Math.floor((dia - ene1 + dowLunes0) / 7) + 1;
}

function redondear_(x, dec) {
  if (x === null || x === '' || isNaN(x)) return '';
  var f = Math.pow(10, dec);
  return Math.round(x * f + (x >= 0 ? 1e-9 : -1e-9)) / f;
}

function minimo_(arr, desde, hasta) {
  var m = null;
  for (var i = desde || 0; i < (hasta === undefined ? arr.length : hasta); i++) {
    var v = arr[i];
    if (typeof v === 'number' && !isNaN(v) && (m === null || v < m)) m = v;
  }
  return m;
}

/** Zonas de la cinta según el punto: izquierda 1-8, central 9-16, derecha 17-24. */
function zonas_(n) {
  var t = Math.round(n / 3);
  return { IZQ: [0, t], CENTRO: [t, 2 * t], DER: [2 * t, n] };
}

/** Criterio del libro BI: ALTA si el mínimo llegó a 0, BAJA si supera el espesor de seguridad, MEDIA en otro caso. */
function estadoCubierta_(minimo, seguridad) {
  if (minimo === null || minimo === '') return '';
  if (minimo <= 0) return 'ALTA';
  return minimo > seguridad ? 'BAJA' : 'MEDIA';
}

/**
 * Calcula toda la serie de una cinta (un equipo o un tramo).
 * @param {Object} cinta  {FECHA_CAMBIO, VIDA_UTIL_DIAS, ESPESOR_CARGA_MM, ESPESOR_RETORNO_MM, ESP_SEG_CARGA_MM, ESP_SEG_RETORNO_MM}
 * @param {Array}  muestras [{FECHA:'yyyy-mm-dd', carga:[24], retorno:[24]}] en cualquier orden
 * @return {Array} una copia ordenada por fecha, cada elemento con la propiedad `calc`
 */
function calcularSerie(cinta, muestras) {
  var lista = muestras.filter(function (m) { return m.FECHA; }).slice();
  lista.sort(function (a, b) { return a.FECHA < b.FECHA ? -1 : a.FECHA > b.FECHA ? 1 : 0; });

  var diaCambio = fechaADia_(cinta.FECHA_CAMBIO);
  var vida = Number(cinta.VIDA_UTIL_DIAS) || 0;
  var origC = Number(cinta.ESPESOR_CARGA_MM), segC = Number(cinta.ESP_SEG_CARGA_MM);
  var origR = Number(cinta.ESPESOR_RETORNO_MM), segR = Number(cinta.ESP_SEG_RETORNO_MM);
  var diaVida = diaCambio + vida;
  var z = zonas_(N_PUNTOS);

  var minPuntoC = [], minPuntoR = [];          // mínimo histórico por punto
  for (var i = 0; i < N_PUNTOS; i++) {
    // MIN_BASE_*: mínimos de muestreos antiguos que no vienen en `muestras` (historial recortado)
    minPuntoC.push(cinta.MIN_BASE_CARGA ? cinta.MIN_BASE_CARGA[i] : null);
    minPuntoR.push(cinta.MIN_BASE_RETORNO ? cinta.MIN_BASE_RETORNO[i] : null);
  }
  var prev = null;

  return lista.map(function (m) {
    var dia = fechaADia_(m.FECHA);
    var diaPrev = prev ? fechaADia_(prev.FECHA) : diaCambio;
    var diasOper = dia - diaCambio;                 // R
    var diasEntre = dia - diaPrev;                  // T

    for (var i = 0; i < N_PUNTOS; i++) {
      var c = m.carga[i], r = m.retorno[i];
      if (typeof c === 'number' && (minPuntoC[i] === null || c < minPuntoC[i])) minPuntoC[i] = c;
      if (typeof r === 'number' && (minPuntoR[i] === null || r < minPuntoR[i])) minPuntoR[i] = r;
    }
    var minC = minimo_(m.carga), minR = minimo_(m.retorno);
    var minHistC = minimo_(minPuntoC), minHistR = minimo_(minPuntoR);
    var acumC = origC - minHistC;                   // BB / AD27
    var acumR = Math.abs(origR - minHistR);         // CK / AD41

    // Fechas de cambio proyectadas — carga (W, X / D19, D20)
    var alarmaC = diaVida, totalC = diaVida;
    if (acumC !== 0 && diasOper !== 0) {
      alarmaC = (origC - segC) / (acumC / diasOper) + diaCambio;
      totalC = origC / (acumC / diasOper) + diaCambio;

    // Retorno (BF, BG / H19, H20). Si no hay desgaste de retorno se usa la fecha de la cubierta de carga.
    var alarmaR = alarmaC, totalR = totalC;
    if (acumR !== 0) {
      if (diasOper !== 0) {
        alarmaR = Math.abs((origR - segR) / (acumR / diasOper)) + diaCambio;

    }

    // si ese límite ya está superado (mínimo en o bajo el límite, o fecha ya cumplida), la de desgaste total.
    var superaC = minC <= segC || Math.floor(alarmaC + 1e-9) <= dia;
    var superaR = minR <= segR || Math.floor(alarmaR + 1e-9) <= dia;

    var calc = {
      FECHA_PROYECCION_CARGA: diaAFecha_(superaC ? totalC : alarmaC), TIPO_PROYECCION_CARGA: superaC ? 'TOTAL' : 'EMERGENCIA',
      FECHA_PROYECCION_RETORNO: diaAFecha_(superaR ? totalR : alarmaR), TIPO_PROYECCION_RETORNO: superaR ? 'TOTAL' : 'EMERGENCIA',
      SEMANA: numeroSemana_(m.FECHA),
      FECHA_PREVIA: diaAFecha_(diaPrev),
      DIAS_OPERACION: diasOper,
      DIAS_ENTRE_MUESTRAS: diasEntre,
      FECHA_FIN_VIDA_UTIL: diaAFecha_(diaVida),
      // Carga
      MIN_CARGA: minC,
      MIN_CARGA_IZQ: minimo_(m.carga, z.IZQ[0], z.IZQ[1]),
      MIN_CARGA_CENTRO: minimo_(m.carga, z.CENTRO[0], z.CENTRO[1]),
      MIN_CARGA_DER: minimo_(m.carga, z.DER[0], z.DER[1]),
      TASA_ESPERADA_CARGA: vida ? (origC - segC) / vida : '',
      // Desgaste entre muestras = mínimo anterior − mínimo actual. Si el mínimo no cambió es 0 (y el diario también);
      // si la cubierta llegó a 0, el desgaste es todo el mínimo anterior.
      DESG_PERIODO_CARGA: prev ? minimo_(prev.carga) - minC : 0,                       // AZ
      DESG_DIARIO_PERIODO_CARGA: prev && diasEntre ? (minimo_(prev.carga) - minC) / diasEntre : 0, // BA

      '<select data-o="' + n + '" data-k="dano" aria-label="Daño">' + opciones(cat.listas.danos, o.dano || cat.listas.danos[0]) + '</select>' +
      '<select data-o="' + n + '" data-k="evaluacion" aria-label="Evaluación">' + opciones(cat.listas.evaluaciones, o.evaluacion || cat.listas.evaluaciones[0]) + '</select></div>';
  });
  s += '</div></div>';
  v.innerHTML = s;

  function f(a, b) { return '<div><span>' + a + '</span>' + h(b) + '</div>'; }
}

/** Actualiza colores, avisos y resumen sin redibujar los campos (para no perder el foco). */
function refrescarLecturas() {
  var eq = equipo(bor.equipo), c = cinta(eq, ui.tramo), t = bor.tramos[ui.tramo], ant = anterior(c, bor.fecha), cub = ui.cub;
  var seg = cub === 'carga' ? c.segCarga : c.segRet, orig = cub === 'carga' ? c.espCarga : c.espRet;
  var sub = suben(c, t, cub), nCrit = 0, nMal = 0, nSobre = 0;
  Array.prototype.forEach.call(document.querySelectorAll('.pt'), function (el) {
    var i = +el.getAttribute('data-i'), v = aNum(t[cub][i]), b = el.querySelector('.ajb');
    el.className = 'pt'; b.classList.add('oculto');
    if (v === null) return;
    if (isNaN(v)) { el.classList.add('mal'); nMal++; return; }
    if (sub.indexOf(i) >= 0) { el.classList.add('sube'); b.classList.remove('oculto'); b.textContent = 'Ajustar a ' + fmtNum_(ant[cub][i]); }
    else if (v <= seg) { el.classList.add('crit'); nCrit++; }
    else if (t.ajustes[clave(cub, i)]) el.classList.add('aj');
    if (v > orig + 1e-9) nSobre++;
  });
  var a = '';
  if (sub.length) a += '<div class="aviso al"><span><b>' + sub.length + (sub.length === 1 ? ' lectura es mayor' : ' lecturas son mayores') + ' que en el muestreo anterior.</b> El espesor no puede aumentar: corrija el valor o ajústelo al del muestreo anterior.</span><button type="button" class="btn mini" id="b-ajtodas">Ajustar todas</button></div>';
  if (nMal) a += '<div class="aviso cr"><span>' + nMal + ' valor(es) no son números válidos.</span></div>';
  if (nSobre) a += '<div class="aviso al"><span>' + nSobre + ' lectura(s) superan el espesor original de ' + orig + ' mm. Verifique la medición.</span></div>';
  if (nCrit) a += '<div class="aviso cr"><span><b>' + nCrit + ' punto(s) en o bajo el espesor de seguridad</b> (' + seg + ' mm).</span></div>';
  $('avisos').innerHTML = a;
  Array.prototype.forEach.call(document.querySelectorAll('[data-cub]'), function (b) { var k = b.getAttribute('data-cub'); b.textContent = (k === 'carga' ? 'Carga ' : 'Retorno ') + contar(t, k) + '/24'; });

  var k = calculoVivo(c, t), s = '';
  if (k) {
    if (!t.prioridadManual && (!cat.config || cat.config.prioridadAuto !== false)) t.prioridad = prioridadSugerida_(k);
    s = '<div class="resumen">' +
      r('Mín. izquierdo', fmtNum_(k.MIN_CARGA_IZQ) + ' mm') + r('Mín. central', fmtNum_(k.MIN_CARGA_CENTRO) + ' mm') + r('Mín. derecho', fmtNum_(k.MIN_CARGA_DER) + ' mm') +
      r('Mín. retorno', fmtNum_(k.MIN_RETORNO) + ' mm') + r('Estado carga', '<span class="chip ' + k.ESTADO_CARGA + '">' + k.ESTADO_CARGA + '</span>') +
      r('Cambio proyectado', textoProyeccion_(k, 'CARGA')) + '</div>';
  } else s = '<p class="tenue">El resumen y la proyección de cambio aparecen al completar las 24 lecturas de carga y de retorno.</p>';
  s += svgPerfil(c, t, ant);
  $('vivo').innerHTML = s;
  Array.prototype.forEach.call(document.querySelectorAll('#prio button'), function (b) { b.className = b.getAttribute('data-p') === t.prioridad ? 'act' : ''; });
  ['CARGA', 'RETORNO'].forEach(function (cb, i) {
    var el = $('proy-' + (4 + i)); if (!el) return;
    el.innerHTML = k ? '<b>' + fmtFecha_(k['FECHA_PROYECCION_' + cb]) + '</b><small>' + (k['TIPO_PROYECCION_' + cb] === 'TOTAL' ? 'Límite de emergencia superado: fecha de desgaste total' : 'Fecha en que alcanza el límite de emergencia') + '</small>'
      : '<small>Se calcula sola al completar las 24 lecturas de carga y de retorno.</small>';
  });
  $('prio-nota').textContent = t.prioridad && !t.prioridadManual ? 'Sugerida según el estado de las cubiertas' : '';
  pintarPie();
  function r(a, b) { return '<div><span>' + a + '</span><b>' + b + '</b></div>'; }
}

var COLORES = ['#5B9BD5', '#ED7D31', '#7F7F7F', '#E0A800', '#70AD47', '#9E480E', '#7030A0', '#00A3A3', '#C0504D'];
function svgPerfil(c, t, ant) {
  var ancho = window.innerWidth < 760 ? 380 : 900, max = Math.ceil(c.espCarga + 1), u = max > 16 ? 15 : 22;
  var W = ancho, L = 30, R = 8, T = 12, B = 24, H = T + B + max * u, ca = lecturas(t, 'carga');
  var previos = c.muestras.filter(function (m) { return m.fecha < bor.fecha; });
  function X(i) { return L + (i + 0.5) * (W - L - R) / 24; }
  function Y(v) { return T + (max - v) * u; }
  function linea(vals, color, w, dash) {
    var d = '', abierto = false;
    vals.forEach(function (v, i) { if (typeof v === 'number' && !isNaN(v)) { d += (abierto ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); abierto = true; } else abierto = false; });
    return d ? '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' stroke-linejoin="round" stroke-linecap="round"/>' : '';
  }
  function rep(v) { var a = []; for (var i = 0; i < 24; i++) a.push(v); return a; }
  var s = '<svg class="perfil" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Perfil de desgaste de la cubierta de carga con todos los muestreos anteriores">';
  for (var v = 0; v <= max; v++) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#E3E7EF"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" font-size="11" text-anchor="end" fill="#5A6478">' + v + '</text>';
  for (var i = 0; i < 24; i++) s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 7) + '" font-size="10" text-anchor="middle" fill="#5A6478">' + (i + 1) + '</text>';
  var ley = '';
  previos.forEach(function (m, k) {
    var col = COLORES[k % COLORES.length];
    s += linea(m.carga, col, 1.6);
    ley += '<span><i style="background:' + col + '"></i>' + fmtFecha_(m.fecha) + '</span>';
  });
  s += linea(rep(0), '#E8590C', 2.5) + linea(rep(c.segCarga), '#C62828', 2, '7 5');
  s += '<text x="' + (W - R - 4) + '" y="' + (Y(c.segCarga) - 5) + '" font-size="11" font-weight="700" text-anchor="end" fill="#C62828">Límite de emergencia ' + c.segCarga + ' mm</text>';
  s += '<text x="' + (W - R - 4) + '" y="' + (Y(0) - 5) + '" font-size="11" font-weight="700" text-anchor="end" fill="#B8450A">Núcleo 0 mm</text>';
  s += linea(ca, '#1B2D66', 3.5);
  ca.forEach(function (v, i) { if (typeof v === 'number' && !isNaN(v)) s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="3.2" fill="#1B2D66"/>'; });
  return s + '</svg><div class="ley"><span><i style="background:#1B2D66;height:4px"></i><b>Este muestreo</b></span>' + ley +
    '<span><i style="background:repeating-linear-gradient(90deg,#C62828 0 5px,transparent 5px 8px)"></i>Límite de emergencia (seguridad)</span><span><i style="background:#E8590C"></i>Núcleo</span></div>';
}

function pintarPie() {
  var eq = bor ? equipo(bor.equipo) : null; if (!eq) return;
  var comp = 0, parc = 0;
  eq.cintas.forEach(function (c) { var t = bor.tramos[c.idCinta], n = contar(t, 'carga') + contar(t, 'retorno'); if (n === 48) comp++; else if (n > 0) parc++; });
  $('pie-txt').textContent = eq.cintas.length > 1 ? comp + ' de ' + eq.cintas.length + ' tramos completos' + (parc ? ' · ' + parc + ' a medias' : '') : (comp ? 'Lecturas completas' : 'Faltan lecturas');
  $('btn-fin').disabled = !comp || parc > 0;
}

/* ---------------- Finalizar ---------------- */
function modal(titulo, cuerpo, botones) {
  var m = $('modal');
  m.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="caja"><h3>' + titulo + '</h3><div>' + cuerpo + '</div><div class="acc">' +
    botones.map(function (b, i) { return '<button type="button" class="btn ' + (b.cls || '') + '" data-b="' + i + '">' + b.t + '</button>'; }).join('') + '</div></div></div>';
  Array.prototype.forEach.call(m.querySelectorAll('[data-b]'), function (el) {
    el.onclick = function () { m.innerHTML = ''; var b = botones[+el.getAttribute('data-b')]; if (b.f) b.f(); };
  });
}

function finalizar(opc) {
  opc = opc || {};
  var eq = equipo(bor.equipo), medidos = eq.cintas.filter(function (c) { var t = bor.tramos[c.idCinta]; return contar(t, 'carga') + contar(t, 'retorno') === 48; });
  if (!medidos.length) return;
  if (!bor.fecha || bor.fecha > hoy()) return modal('Revise la fecha', 'La fecha del muestreo no puede ser posterior a hoy.', [{ t: 'Entendido', cls: 'pri' }]);
  var antigua = medidos.filter(function (c) { return bor.fecha < c.fechaCambio; })[0];
  if (antigua) return modal('Revise la fecha', 'La fecha es anterior al cambio de cinta (' + fmtFecha_(antigua.fechaCambio) + ').', [{ t: 'Entendido', cls: 'pri' }]);
  if (!bor.elaborado) return modal('Falta el operador', 'Indique quién elabora el muestreo en "Elaborado por".', [{ t: 'Entendido', cls: 'pri' }]);

  // Lecturas mayores que el muestreo anterior: el operador decide
  if (!opc.subidasVistas) {
    var total = 0;
    medidos.forEach(function (c) { var t = bor.tramos[c.idCinta]; total += suben(c, t, 'carga').length + suben(c, t, 'retorno').length; });
    if (total) return modal('Lecturas mayores que el muestreo anterior',
      'Hay <b>' + total + '</b> lectura(s) con más espesor que en el muestreo anterior. ¿Qué desea hacer?', [
        { t: 'Ajustarlas al valor anterior y guardar', cls: 'pri', f: function () { medidos.forEach(function (c) { var t = bor.tramos[c.idCinta]; ['carga', 'retorno'].forEach(function (k) { suben(c, t, k).forEach(function (i) { ajustar(c, t, k, i); }); }); }); guardarBorrador(); finalizar({ subidasVistas: true }); } },
        { t: 'Guardar tal como se midieron', f: function () { finalizar({ subidasVistas: true }); } },
        { t: 'Volver a revisar', f: function () { pintarMuestreo(); } }]);
  }
  // Mismo equipo y fecha ya registrados
  var repetido = medidos.some(function (c) { return c.muestras.some(function (m) { return m.fecha === bor.fecha; }); });
  if (repetido && !opc.reemplazar) return modal('Ya hay un muestreo en esa fecha',
    'Este equipo ya tiene un muestreo del ' + fmtFecha_(bor.fecha) + '. ¿Reemplazarlo por este?', [
      { t: 'Reemplazar', cls: 'pri', f: function () { finalizar({ subidasVistas: true, reemplazar: true }); } }, { t: 'Cancelar' }]);

  function persona(n) { var p = (cat.listas.personas || []).filter(function (x) { return x.nombre === n; })[0]; return { nombre: n || '', cargo: p ? p.cargo : '' }; }
  var ins = (cat.listas.instrumentos || []).filter(function (x) { return x.modelo === bor.instrumento; })[0] || { modelo: bor.instrumento };
  var v = { id: 'INF-' + bor.fecha.replace(/-/g, '') + '-' + eq.id + '-' + Math.random().toString(36).slice(2, 6).toUpperCase(),
    equipo: eq.id, fecha: bor.fecha, ot: bor.ot, rev: bor.rev, creado: hoy(), elaborado: persona(bor.elaborado), revisado: persona(bor.revisado), aprobado: persona(bor.aprobado),
    instrumento: { modelo: ins.modelo || '', ultimaCal: ins.ultimaCal || '', proximaCal: ins.proximaCal || '' }, reemplazar: !!opc.reemplazar, estado: 'pendiente',
    tramos: medidos.map(function (c) {
      var t = bor.tramos[c.idCinta], k = calculoVivo(c, t);
      return { idCinta: c.idCinta, carga: lecturas(t, 'carga'), retorno: lecturas(t, 'retorno'), prioridad: t.prioridad || prioridadSugerida_(k),
        ajustes: Object.keys(t.ajustes).sort().map(function (a) { return a + ' ' + t.ajustes[a]; }),
        obs: t.obs.map(function (o, n) { return n >= 4 ? { causa: 'N/A', dano: 'N/A', evaluacion: 'N/A' } : { causa: o.causa || cat.listas.causas[0], dano: o.dano || cat.listas.danos[0], evaluacion: o.evaluacion || cat.listas.evaluaciones[0] }; }) };
    }) };
  visitas = visitas.filter(function (x) { return !(x.equipo === v.equipo && x.fecha === v.fecha && x.estado !== 'sincronizado'); });
  visitas.unshift(v); if (visitas.length > 40) visitas = visitas.filter(function (x, i) { return i < 40 || x.estado !== 'sincronizado'; });
  guardar(K.vis, visitas);
  cfg.operador = bor.elaborado; guardar(K.cfg, cfg);
  aplicarLocales(); guardar(K.cat, cat);
  bor = null; guardarBorrador();
  ui.resultado = v.id; ui.tramo = null; ui.cub = 'carga';
  pintarMuestreo(); pintarEstado(); window.scrollTo(0, 0);
  sincronizar();
}

function chipVisita(v) {
  if (v.estado === 'sincronizado') return '<span class="chip ok">Guardado en la base de datos</span>';
  if (v.estado === 'conflicto') return '<span class="chip err">Ya existe en la base</span>';
  if (v.estado === 'error') return '<span class="chip err">No se pudo enviar</span>';
  return '<span class="chip pend">Guardado en el dispositivo · por enviar</span>';
}

function htmlResultado() {

  var s = '<div class="tar"><h2>Muestreo guardado · ' + h(eq.id) + ' · ' + fmtFecha_(v.fecha) + '</h2><p>' + chipVisita(v) + '</p>';
  if (v.estado !== 'sincronizado') s += '<div class="aviso inf"><span>' + (v.mensaje ? h(v.mensaje) + ' ' : '') + (hayServidor() ? 'Los datos quedan en este dispositivo y se envían a la base de datos en cuanto haya conexión.' : 'Los datos quedan en este dispositivo. Configure la conexión en Ajustes para enviarlos a la base de datos.') + '</span></div>';
  s += '<div class="lista">';
  v.tramos.forEach(function (t) {

    s += '<div class="item"><div class="d"><b>' + (eq.cintas.length > 1 ? h(c.tramo) : 'Resultado') + '</b><small>Mín. carga ' + fmtNum_(k.MIN_CARGA) + ' mm · mín. retorno ' + fmtNum_(k.MIN_RETORNO) + ' mm · cambio proyectado ' + textoProyeccion_(k, 'CARGA') + '</small></div>' +
      '<span class="chip ' + k.ESTADO_CARGA + '">Carga ' + k.ESTADO_CARGA + '</span><span class="chip gris">Prioridad ' + h(t.prioridad) + '</span></div>';
  });
  s += '</div><div class="barra" style="margin-top:14px"><button type="button" class="btn nar gde" data-pdf="' + h(v.id) + '">Descargar informe PDF</button>' +
    '<button type="button" class="btn gde" id="b-nuevo">Nuevo muestreo</button></div></div>';
  return s;
}

/* ---------------- Cambio de cinta (por tramo) ---------------- */
function formCambio(eq, c) {
  var multi = eq.cintas.length > 1;
  function campo(id, et, val, tipo) { return '<div class="campo"><label for="' + id + '">' + et + '</label><input id="' + id + '" value="' + h(val) + '"' + (tipo === 'n' ? ' inputmode="decimal"' : tipo === 'd' ? ' type="date" max="' + hoy() + '"' : '') + ' autocomplete="off"></div>'; }
  var cuerpo = '<p class="tenue">Se reinicia el período de <b>' + h(eq.id) + (multi ? ' · ' + h(c.tramo) : '') + '</b>: días de operación, desgaste y proyección parten desde la fecha de cambio.' +
    (multi ? ' Los demás tramos del equipo no se modifican.' : '') + ' El historial de la cinta retirada queda guardado en la base de datos.</p><div class="campos">' +
    campo('k-fecha', 'Fecha de cambio', hoy(), 'd') + campo('k-espec', 'Especificación', c.espec) + campo('k-fab', 'Fabricante', c.fabricante) + campo('k-grado', 'Grado cubierta', c.grado) +
    campo('k-tot', 'Espesor total (mm)', c.espTotal, 'n') + campo('k-car', 'Espesor carga (mm)', c.espCarga, 'n') + campo('k-ret', 'Espesor retorno (mm)', c.espRet, 'n') +
    campo('k-cab', 'Cables / telas', c.cables, 'n') + campo('k-anc', 'Ancho (mm)', c.ancho, 'n') + campo('k-vida', 'Vida útil (días)', c.vidaUtil, 'n') +
    campo('k-sc', 'Seguridad carga (mm)', c.segCarga, 'n') + campo('k-sr', 'Seguridad retorno (mm)', c.segRet, 'n') + '</div><div id="k-err"></div>';
  modal('Cambio de cinta', cuerpo, [{ t: 'Registrar cambio y reiniciar', cls: 'nar' }, { t: 'Cancelar' }]);
  document.querySelector('#modal .caja').style.maxWidth = '720px';
  document.querySelector('#modal [data-b="0"]').onclick = function () {
    function n(id) { return aNum($(id).value.trim()); }
    function err(m) { $('k-err').innerHTML = '<div class="aviso cr"><span>' + m + '</span></div>'; }
    var fecha = $('k-fecha').value, nueva = { espec: $('k-espec').value.trim(), fabricante: $('k-fab').value.trim(), grado: $('k-grado').value.trim(), espTotal: n('k-tot'), espCarga: n('k-car'), espRet: n('k-ret'),
      cables: n('k-cab'), ancho: n('k-anc'), vidaUtil: n('k-vida'), segCarga: n('k-sc'), segRet: n('k-sr'), fechaCambio: fecha };
    var nums = ['espTotal', 'espCarga', 'espRet', 'ancho', 'vidaUtil', 'segCarga', 'segRet'];
    if (!fecha || fecha > hoy()) return err('Indique una fecha de cambio válida (no posterior a hoy).');
    if (nums.some(function (k) { return nueva[k] === null || isNaN(nueva[k]); }) || nueva.espCarga <= 0 || nueva.ancho <= 0 || nueva.vidaUtil <= 0) return err('Complete todos los valores numéricos.');
    if (nueva.segCarga >= nueva.espCarga || nueva.segRet >= nueva.espRet) return err('El espesor de seguridad debe ser menor que el espesor original.');
    if (fecha <= c.fechaCambio) return err('La fecha debe ser posterior al cambio anterior (' + fmtFecha_(c.fechaCambio) + ').');
    var ult = c.muestras.length ? c.muestras[c.muestras.length - 1].fecha : '';
    if (ult && ult > fecha) return err('Esta cinta tiene un muestreo del ' + fmtFecha_(ult) + ', posterior a la fecha indicada.');
    if (nueva.cables === null || isNaN(nueva.cables)) nueva.cables = '';
    var base = c.idCinta.replace(/-\d{8}$/, '');
    var k = { id: 'CAM-' + fecha.replace(/-/g, '') + '-' + Math.random().toString(36).slice(2, 6).toUpperCase(), equipo: eq.id, tramo: c.tramo, idCintaAnterior: c.idCinta,
      idCintaNueva: base + '-' + fecha.replace(/-/g, ''), nueva: nueva, registradoPor: bor.elaborado || '', creado: hoy(), estado: 'pendiente' };
    cambios.unshift(k); guardar('me_cambios', cambios);
    aplicarCambio(k); guardar(K.cat, cat);
    var v = []; for (var i = 0; i < 24; i++) v.push('');
    delete bor.tramos[c.idCinta];
    bor.tramos[k.idCintaNueva] = { carga: v.slice(), retorno: v.slice(), prioridad: '', prioridadManual: false, ajustes: {}, obs: ITEMS.map(function () { return { causa: '', dano: '', evaluacion: '' }; }) };
    ui.tramo = k.idCintaNueva; guardarBorrador();
    $('modal').innerHTML = ''; pintarMuestreo(); pintarEstado(); sincronizar();
  };
}

/* ---------------- Vista: Informes ---------------- */

  s += '<div class="tar"><h2>Muestreos guardados en este dispositivo</h2><div class="lista">';

    s += '<div class="item"><div class="d"><b>' + h(v.equipo) + ' · ' + fmtFecha_(v.fecha) + '</b><small>' + v.tramos.length + (v.tramos.length === 1 ? ' tramo' : ' tramos') + ' · OT ' + h(v.ot || '—') + (v.mensaje ? ' · ' + h(v.mensaje) : '') + '</small></div>' + chipVisita(v) +
      (v.estado === 'conflicto' ? '<button type="button" class="btn mini" data-reemp="' + h(v.id) + '">Reemplazar en la base</button>' : '') +
      (v.urlPdf ? '<a class="btn mini" href="' + h(v.urlPdf) + '" target="_blank" rel="noopener">Ver en Drive</a>' : '') +
      '<button type="button" class="btn mini" data-pdf="' + h(v.id) + '">PDF</button></div>';
  });

      var l = (cat.listas.personas || []).filter(function (x) { return normEq(x.nombre) === normEq(p.nombre); })[0]; if (l) p.cargo = l.cargo;
    });
    r.base64 = aBase64(new Uint8Array(buf));
    return r;
  });
}

function prepararImport(lista) {
  var res = [], p = Promise.resolve();
  modal('Leyendo archivos…', '<p class="tenue">Un momento.</p>', []);
  lista.forEach(function (f) {
    p = p.then(function () { return analizarLibro(f).then(function (r) { res.push(r); }, function (e) { res.push({ nombre: f.name, error: (e && e.message) || String(e) }); }); });
  });
  return p.then(function () {
    $('modal').innerHTML = '';
    res.sort(function (a, b) { return (a.equipo || '') < (b.equipo || '') ? -1 : (a.equipo || '') > (b.equipo || '') ? 1 : ((a.informe || {}).fecha || '') < ((b.informe || {}).fecha || '') ? -1 : 1; });
    imp = { archivos: res, reemplazar: imp ? imp.reemplazar : false };
    pintarInformes();
    var el = $('imp'); if (el) el.scrollIntoView({ block: 'start' });
  });
}

function htmlImport() {
  var s = '<div class="tar" id="imp"><h2>Importar informes anteriores</h2><p class="tenue">Elija uno o varios libros Excel de medición de espesores (hoja General y hojas de muestras por tramo). ' +
    'Se cargan las lecturas que la base no tenga, con su historial completo, y el informe con su OT, revisión, prioridad, observación, firmas e instrumento. El Excel original queda guardado en Drive.</p>' +
    '<div class="barra"><button type="button" class="btn pri" id="imp-elegir">Elegir archivo(s) Excel</button></div>';
  if (!imp) return s + '</div>';
  var validos = 0;
  imp.archivos.forEach(function (a) {
    s += '<div class="item" style="display:block;margin-top:10px"><b>' + h(a.nombre.replace(/^\d{10,}_/, '')) + '</b>';
    if (a.error) { s += '<div class="aviso cr"><span>No se puede importar: ' + h(a.error) + '</span></div></div>'; return; }
    validos++;
    var i = a.informe;
    s += '<div class="tenue" style="margin-top:4px">' + h(a.equipo) + ' · informe del ' + h(fmtFecha_(i.fecha) || '—') + ' · OT ' + h(i.ot || '—') + ' · ' + h(i.rev || '') +
      (i.prioridad ? ' · <span class="chip ' + i.prioridad.toUpperCase() + '">Prioridad ' + h(i.prioridad) + '</span>' : '') +
      (a.resultado ? ' · <span class="chip ok">Importado</span>' : '') + '</div>';
    if (i.observacion) s += '<div class="tenue" style="margin-top:4px;white-space:pre-wrap;max-height:4.5em;overflow:hidden">' + h(i.observacion) + '</div>';
    s += '<div class="lista" style="margin-top:6px">';
    a.tramos.forEach(function (t) {
      s += '<div class="tenue">• ' + h(t.tramo) + (t.hoja ? ' (hoja "' + h(t.hoja) + '")' : '') + ': <b>' + t.nuevas + ' muestreo' + (t.nuevas === 1 ? '' : 's') + ' nuevo' + (t.nuevas === 1 ? '' : 's') + '</b>' +
        (t.enBase ? ' · ' + t.enBase + ' ya en la base' : '') + (t.antes ? ' · ' + t.antes + ' anterior' + (t.antes === 1 ? '' : 'es') + ' al cambio de cinta (se omite' + (t.antes === 1 ? '' : 'n') + ')' : '') +
        (t.incompletas ? ' · ' + t.incompletas + ' incompleta' + (t.incompletas === 1 ? '' : 's') : '') + '</div>';
    });
    s += '</div>';
    a.avisos.forEach(function (x) { s += '<div class="aviso al" style="margin:6px 0 0"><span>' + h(x) + '</span></div>'; });
    if (a.resultado) s += '<div class="aviso ok" style="margin:6px 0 0"><span>' + h(a.resultado) + '</span></div>';
    s += '</div>';
  });
  s += '<label class="tenue" style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="imp-reemp"' + (imp.reemplazar ? ' checked' : '') + '> ' +
    'Reemplazar las lecturas que ya están en la base con las del Excel (si no se marca, solo se agregan las que faltan)</label>' +
    '<div class="barra">' + (validos ? '<button type="button" class="btn nar" id="imp-ok">Importar ' + validos + ' informe' + (validos > 1 ? 's' : '') + '</button>' : '') +
    '<button type="button" class="btn" id="imp-cancelar">' + (imp.hecho ? 'Cerrar' : 'Cancelar') + '</button></div>';
  return s + '</div>';
}

function ejecutarImport() {
  if (!hayServidor()) return modal('Sin base de datos', 'Configure la conexión en Ajustes para importar.', [{ t: 'Entendido', cls: 'pri' }]);
  var lista = imp.archivos.filter(function (a) { return !a.error && !a.resultado; }), n = 0, errores = 0;
  if (!lista.length) return;
  var p = Promise.resolve();
  lista.forEach(function (a) {
    p = p.then(function () {
      modal('Importando…', '<p class="tenue">' + h(a.equipo) + ' (' + (++n) + ' de ' + lista.length + '). No cierre esta ventana.</p>', []);
      var paquete = { equipo: a.equipo, archivo: { nombre: a.nombre, base64: a.base64 }, informe: a.informe, reemplazar: imp.reemplazar,
        tramos: a.tramos.map(function (t) { return { idCinta: t.idCinta, muestras: t.muestras }; }) };
      return llamar('apiImportar', paquete).then(function (r) {
        if (!r || !r.ok) throw new Error((r && r.mensaje) || 'No se pudo importar');
        a.resultado = r.nuevas + ' muestreo(s) agregado(s)' + (r.reemplazadas ? ', ' + r.reemplazadas + ' reemplazado(s)' : '') + (r.existentes ? ', ' + r.existentes + ' ya estaban' : '') +
          (r.anteriores ? ', ' + r.anteriores + ' anterior(es) al cambio de cinta omitido(s)' : '') + '. Informe: ' + r.informe + '.';
        delete a.base64;
      }).catch(function (e) { errores++; a.avisos.push('No se importó: ' + ((e && e.message) || e)); });
    });
  });
  p.then(function () { return actualizarCatalogo().catch(function () {}); }).then(function () {
    imp.hecho = true; $('modal').innerHTML = ''; pintarInformes(); pintarEstado();
    var el = $('imp'); if (el) el.scrollIntoView({ block: 'start' });
    modal(errores ? 'Importación con problemas' : 'Importación lista', errores ? errores + ' archivo(s) no se pudieron importar: revise los avisos de cada uno. Puede volver a intentarlo; lo ya cargado no se duplica.' :
      'Se cargaron ' + lista.length + ' informe(s). El historial y la proyección de cada cinta ya consideran estas lecturas.', [{ t: 'Entendido', cls: 'pri' }]);
  });
}

/* ---------------- Navegación y eventos ---------------- */
var actual = 'muestreo';
function ver(v) {
  actual = v;
  ['muestreo', 'informes', 'ajustes'].forEach(function (x) { $('v-' + x).classList.toggle('oculto', x !== v); });
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('act', b.getAttribute('data-vista') === v); });
  $('pie').classList.toggle('oculto', v !== 'muestreo' || !bor || !!ui.resultado);
  if (v === 'muestreo') pintarMuestreo(); if (v === 'informes') pintarInformes(); if (v === 'ajustes') pintarAjustes();
}

document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('button,a') : null; if (!el) return;
  var a;
  if ((a = el.getAttribute('data-vista'))) return ver(a);
  if ((a = el.getAttribute('data-pdf'))) { var v = visitas.filter(function (x) { return x.id === a; })[0]; return descargar(equipo(v.equipo), v); }
  if ((a = el.getAttribute('data-reemp'))) { var w = visitas.filter(function (x) { return x.id === a; })[0]; w.reemplazar = true; guardar(K.vis, visitas); return sincronizar(); }
  if (el.id === 'estado' || el.id === 'b-sync') return sincronizar();
  if (el.id === 'b-ulteq') { var eq = equipo(ui.eqInf); return descargar(eq, eq.ultimoInforme); }
  if (el.id === 'b-nuevo') { ui.resultado = null; return pintarMuestreo(); }
  if (el.id === 'imp-elegir') { var fi = $('imp-file'); fi.value = ''; return fi.click(); }
  if (el.id === 'imp-cancelar') { imp = null; return pintarInformes(); }
  if (el.id === 'imp-ok') return ejecutarImport();
  if (el.id === 'btn-fin') return finalizar();
  if (el.id === 'a-act') {
    if (!EN_GAS) { cfg.url = $('a-url').value.trim(); cfg.clave = $('a-clave').value.trim(); guardar(K.cfg, cfg); }
    ui.errorSync = ''; return sincronizar();
  }
  if (!bor) return;
  var eqb = equipo(bor.equipo), c = cinta(eqb, ui.tramo), t = bor.tramos[ui.tramo];
  if ((a = el.getAttribute('data-tramo'))) { ui.tramo = a; return pintarMuestreo(); }
  if ((a = el.getAttribute('data-cub'))) { ui.cub = a; return pintarMuestreo(); }
  if ((a = el.getAttribute('data-p'))) { t.prioridad = a; t.prioridadManual = true; guardarBorrador(); return refrescarLecturas(); }
  if (el.classList.contains('ajb')) { var i = +el.parentNode.getAttribute('data-i'); ajustar(c, t, ui.cub, i); el.parentNode.querySelector('input').value = t[ui.cub][i]; guardarBorrador(); return refrescarLecturas(); }
  if (el.id === 'b-ajtodas') { suben(c, t, ui.cub).forEach(function (i) { ajustar(c, t, ui.cub, i); }); guardarBorrador(); return pintarMuestreo(); }
  if (el.id === 'b-cambio') {
    if (!window.TRAMO_FORM) return formCambio(eqb, c);
    var nT = /(\d+)/.exec(c.tramo || ''); 
    return TRAMO_FORM.abrir({ equipo: eqb.id, tramo: nT ? +nT[1] : 1, alGuardar: function (r) { if (!(r && r.enCola)) location.reload(); } });
  }
  if (el.id === 'b-copiar') { var ant = anterior(c, bor.fecha); t[ui.cub] = ant[ui.cub].map(function (x) { return x === null ? '' : String(x); }); guardarBorrador(); return pintarMuestreo(); }
  if (el.id === 'b-limpiar') { t[ui.cub] = t[ui.cub].map(function () { return ''; }); Object.keys(t.ajustes).forEach(function (k) { if (k.charAt(0) === (ui.cub === 'carga' ? 'C' : 'R')) delete t.ajustes[k]; }); guardarBorrador(); return pintarMuestreo(); }
  if (el.id === 'b-todos') return modal('Un mismo valor en los 24 puntos', '<div class="campo"><label for="m-val">Espesor de ' + ui.cub + ' (mm)</label><input id="m-val" inputmode="decimal" autocomplete="off"></div>', [
    { t: 'Aplicar', cls: 'pri', f: function () { } }, { t: 'Cancelar' }]) || (function () {
      var b = document.querySelector('#modal [data-b="0"]'), inp = $('m-val'); inp.focus();
      b.onclick = function () { var n = aNum(inp.value); if (n === null || isNaN(n)) return; t[ui.cub] = t[ui.cub].map(function () { return String(n); }); $('modal').innerHTML = ''; guardarBorrador(); pintarMuestreo(); };
    })();
});

document.addEventListener('input', function (e) {
  var el = e.target, pt = el.parentNode;
  if (bor && pt && pt.classList && pt.classList.contains('pt')) {
    var i = +pt.getAttribute('data-i'), t = bor.tramos[ui.tramo];
    t[ui.cub][i] = el.value.trim(); delete t.ajustes[clave(ui.cub, i)];
    guardarBorrador(); refrescarLecturas();
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var pt = e.target.parentNode;
  if (pt && pt.classList && pt.classList.contains('pt')) {
    e.preventDefault();
    var sig = document.querySelector('.pt[data-i="' + (+pt.getAttribute('data-i') + 1) + '"] input');
    if (sig) { sig.focus(); sig.select(); } else e.target.blur();
  }
});
document.addEventListener('change', function (e) {
  var el = e.target, id = el.id;
  if (id === 'f-eq') {
    ui.resultado = null; ui.tramo = null; ui.cub = 'carga';
    var con = bor && Object.keys(bor.tramos).some(function (k) { return contar(bor.tramos[k], 'carga') + contar(bor.tramos[k], 'retorno') > 0; });
    var cambiar = function () { bor = el.value ? nuevoBorrador(el.value) : null; guardarBorrador(); pintarMuestreo(); };
    if (con && el.value !== bor.equipo) return modal('Hay lecturas sin guardar', 'Al cambiar de equipo se pierden las lecturas ingresadas de ' + h(bor.equipo) + '.', [{ t: 'Cambiar de equipo', cls: 'pri', f: cambiar }, { t: 'Seguir con ' + h(bor.equipo), f: pintarMuestreo }]);
    return cambiar();
  }
  if (id === 'i-eq') { ui.eqInf = el.value; return pintarUltimoEquipo(); }
  if (id === 'imp-reemp') { if (imp) imp.reemplazar = el.checked; return; }
  if (id === 'imp-file') { var lf = Array.prototype.slice.call(el.files || []); el.value = ''; if (lf.length) prepararImport(lf).catch(function (er) { $('modal').innerHTML = ''; modal('No se pudo leer', h(er.message), [{ t: 'Entendido', cls: 'pri' }]); }); return; }
  if (!bor) return;
  var mapa = { 'f-ot': 'ot', 'f-ela': 'elaborado', 'f-ins': 'instrumento', 'f-rev': 'revisado', 'f-apr': 'aprobado', 'f-revn': 'rev' };
  if (id === 'f-fecha') { bor.fecha = el.value; guardarBorrador(); return pintarMuestreo(); }
  if (mapa[id]) { bor[mapa[id]] = el.value.trim(); if (id === 'f-ot') bor.otAuto = false; guardarBorrador(); if (id === 'f-ela') pintarMuestreo(); return; }
  if (el.getAttribute('data-o') !== null) { bor.tramos[ui.tramo].obs[+el.getAttribute('data-o')][el.getAttribute('data-k')] = el.value; return guardarBorrador(); }
});

window.addEventListener('offline', function () { ui.enLinea = false; pintarEstado(); });

if (!EN_GAS && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') && 'serviceWorker' in navigator) {
  var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l);
  navigator.serviceWorker.register('sw.js').catch(function () { });
}
window.__app = { sincronizar: sincronizar, estado: function () { return { visitas: visitas, bor: bor, cat: cat, ui: ui }; } };
})();
