<style>#velo.icc,.cargando.icc{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:#0b254580;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:icc-entra .2s ease-out}#velo.icc.oculto,.cargando.icc.oculto{display:none}.icc-caja{width:min(300px,100%);background:#fff;border-radius:18px;padding:22px 22px 16px;box-shadow:0 18px 50px #0b254559;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#14213d;font:700 15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.icc-caja #veloTxt,.icc-caja #cargTxt{min-height:1.35em}.icc-cinta{position:relative;width:200px;height:74px;flex:none}.icc-cinta:before{content:"";position:absolute;left:0;right:0;top:30px;height:40px;box-sizing:border-box;border:4px solid #1F4E8C;border-radius:20px}.icc-cinta:after{content:"";position:absolute;left:20px;right:20px;top:30px;height:4px;background:repeating-linear-gradient(90deg,#8FB0DA 0 8px,transparent 8px 18px);animation:icc-banda .6s linear infinite}.icc-cinta i{position:absolute;top:36px;width:28px;height:28px;border-radius:50%;box-sizing:border-box;border:3px solid #1F4E8C;background:conic-gradient(#1f4e8c 0 12%,#eaf1fb 0 25%,#1f4e8c 0 37%,#eaf1fb 0 50%,#1f4e8c 0 62%,#eaf1fb 0 75%,#1f4e8c 0 87%,#eaf1fb 0);animation:icc-gira 1.2s linear infinite}.icc-cinta i:first-child{left:6px}.icc-cinta i:nth-child(2){right:6px}.icc-cinta b{position:absolute;left:22px;top:19px;width:13px;height:11px;background:#e35205;border-radius:45% 55% 40% 60%;opacity:0;animation:icc-mineral 2.4s linear infinite}.icc-cinta b:nth-of-type(2){width:10px;height:9px;background:#8a6a4f;animation-delay:-.8s}.icc-cinta b:nth-of-type(3){width:12px;height:10px;background:#b84305;animation-delay:-1.6s}.icc-barra{position:relative;width:100%;height:4px;border-radius:4px;background:#eaf1fb;overflow:hidden}.icc-barra:after{content:"";position:absolute;top:0;bottom:0;width:35%;border-radius:4px;background:
