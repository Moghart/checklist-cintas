<!DOCTYPE html>
<html lang="es">
<head>
  <!-- App instalable Inspección Cintas: sesión + funcionamiento sin señal -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0b2545">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inspección Cintas">
  <script src="config.js"></script>
  <script src="sesion.js"></script>
  <script src="funciones.js"></script>
  <script>window.PUENTE = {"colaEscritura": true, "modulo": "MAPEO", "app": "mapeo"};</script>
  <script src="puente.js"></script>
  <script src="preparar.js"></script>
  <script src="marco.js"></script>
  <link rel="stylesheet" href="tema.css">
  <script src="tramos.js"></script>

  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapeo de Cintas · Inspección Cintas</title>
  <style>
  :root{
    --azul:#2F5597; --azul-osc:#1F3864; --azul-claro:#DAE3F3; --gris:#D9D9D9; --gris2:#A6A6A6; --gris-fondo:#EEF1F5;
    --negro:#111; --borde:#9AA4B2; --texto:#1d2330; --muted:#5f6b7a; --ok:#00B050; --rojo:#C00000; --amarillo:#FFC000;
    --radio:6px; --sombra:0 1px 3px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--gris-fondo);color:var(--texto);font:14px/1.4 Calibri,"Segoe UI",Roboto,Arial,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--azul)}

  /* ---------- barra superior */
  .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--azul);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .logos-top{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:5px;padding:3px 10px;height:46px}
  .logos-top img{height:38px;width:auto;display:block}
  .logos-top img+img{border-left:1px solid #ddd;padding-left:10px}
  .top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;line-height:1.1}
  .top h1 small{display:block;font-weight:400;font-size:12px;opacity:.85}
  .top .sp{flex:1}
  .chip-user{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap}

  main{max-width:1500px;margin:0 auto;padding:16px}

  /* ---------- botones */
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--azul);background:#fff;color:var(--azul);padding:7px 12px;border-radius:var(--radio);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
  .btn:hover{background:var(--azul-claro)}
  .btn.pri{background:var(--azul);color:#fff}
  .btn.pri:hover{background:var(--azul-osc)}
  .btn.peligro{border-color:var(--rojo);color:var(--rojo)}
  .btn.peligro:hover{background:#fde8e8}
  .btn.sm{padding:4px 8px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .toolbar .titulo{font-size:20px;font-weight:700;margin-right:8px}

  /* ---------- inicio */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:#fff;border-radius:var(--radio);padding:10px 14px;box-shadow:var(--sombra);border-left:5px solid var(--azul)}
  .kpi b{display:block;font-size:24px;line-height:1.1}
  .kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .filtros input[type=search]{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--borde);border-radius:var(--radio);background:#fff}
  .pill{border:1px solid var(--borde);background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer}
  .pill.on{background:var(--azul);color:#fff;border-color:var(--azul)}
  .grid-cintas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .card{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);overflow:hidden;cursor:pointer;border:1px solid transparent;transition:transform .08s}
  .card:hover{border-color:var(--azul);transform:translateY(-1px)}
  .card .cab{background:var(--azul);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
  .card .cab b{font-size:16px;letter-spacing:.3px}
  .card .cuerpo{padding:10px 12px;font-size:13px}
  .card .fila{display:flex;justify-content:space-between;border-bottom:1px dashed #e3e6ea;padding:3px 0}
  .card .fila span:first-child{color:var(--muted)}
  .badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .badge{display:inline-block;border-radius:3px;padding:1px 7px;font-size:11px;font-weight:700;border:1px solid rgba(0,0,0,.25)}
  .estado-dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;display:inline-block}

  /* ---------- HOJA (réplica de la planilla) */
  .hoja{background:#fff;border:1px solid #000;padding:14px 16px;margin-bottom:16px;box-shadow:var(--sombra)}
  .hoja-tit{display:grid;grid-template-columns:200px 1fr 200px;align-items:center;margin-bottom:10px}
  .hoja-tit h2{text-align:center;margin:0;font-size:24px;text-decoration:underline}
  .hoja-tit img{max-height:64px;max-width:190px}
  .hoja-tit .der{text-align:right}
  .cab-grid{display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(240px,1fr) minmax(280px,1.1fr) minmax(260px,1.3fr);gap:18px;align-items:start}
  table.x{border-collapse:collapse;width:100%;font-size:12.5px}
  table.x td,table.x th{border:1px solid #000;padding:3px 6px;height:22px}
  table.x .lab{background:var(--azul);color:#fff;width:58%}
  table.x .val{text-align:center;font-weight:700;background:#fff}
  table.x .gr{background:var(--gris);text-align:center;font-weight:400}
  table.x th{background:var(--azul);color:#fff;font-weight:700;text-align:center}
  .img-cinta{width:100%;max-height:330px;object-fit:contain;border:1px solid #e5e5e5;background:#fafafa}
  .img-vacia{height:200px;display:flex;align-items:center;justify-content:center;border:2px dashed var(--gris2);color:var(--muted);text-align:center;padding:10px}
  .sec-tit{text-align:center;font-size:22px;font-weight:700;text-decoration:underline;border:1px solid #000;padding:4px;margin:0 0 12px}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.hall{border-collapse:collapse;width:100%;min-width:1100px;font-size:12.5px}
  table.hall th{background:var(--azul);color:#fff;border:1px solid #fff;padding:4px;font-weight:700}
  table.hall td{border:1px solid #000;padding:4px 6px;text-align:center;height:34px}
  table.hall td.ubi{background:var(--azul);color:#fff;font-weight:700}
  table.hall td.det{text-align:left;min-width:220px}
  table.hall tr.dato{cursor:pointer}
  table.hall tr.dato:hover td:not(.ubi):not(.crit){background:#f1f5fc}
  table.hall tr.cerrado td{opacity:.55;text-decoration:line-through}
  table.hall td.crit{font-weight:700}
  .foto-ind{font-size:11px;color:var(--azul);font-weight:700;white-space:nowrap}

  /* ---------- diagrama */
  .giro{display:flex;align-items:center;gap:14px;font-weight:700;margin:14px 0 6px}
  .giro .flecha{color:var(--rojo);font-size:22px;letter-spacing:-2px}
  .tramo{margin-bottom:14px;min-width:1100px}
  .tramo table{border-collapse:collapse;width:100%;table-layout:fixed}
  .tramo th{background:var(--azul);color:#fff;font-size:10.5px;font-weight:700;border:1px solid #fff;padding:2px;text-align:center}
  .tramo td.emp{background:var(--gris2);font-weight:700;text-align:center;width:90px;border:1px solid #000;cursor:default;font-size:13px}
  .tramo td.ins{background:var(--azul);color:#fff;font-weight:700;font-size:10.5px;text-align:center;border:1px solid #000;width:90px}
  .tramo td.banda{padding:0;border:1px solid #000;background:#000}
  .tramo td.insbar{padding:0;border:1px solid #000;height:22px}
  .tramo svg{display:block;width:100%}
  .mk{cursor:pointer}
  .mk:hover rect{stroke:#00E5FF;stroke-width:3}
  .leyenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin:6px 0 10px}
  .leyenda i{display:inline-block;width:14px;height:14px;border:1px solid #000;vertical-align:middle;margin-right:4px}

  /* ---------- historial */
  details.hist{background:#fff;box-shadow:var(--sombra);border-radius:var(--radio);padding:8px 12px;margin-bottom:20px}
  details.hist summary{cursor:pointer;font-weight:700;color:var(--azul)}
  .hist-l{font-size:12px;max-height:300px;overflow:auto}
  .hist-l{font-size:13px;max-height:360px}
  .hist-l .hf{border-bottom:1px solid #eef1f5;padding:8px 2px}
  .hist-l .hf-c{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
  .hist-l .hf-c b{color:var(--azul)}.hist-l .hf-c span{color:var(--texto)}
  .hist-l .hf-c small{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
  .hist-l .hf-d{color:#3b4656;margin-top:3px;line-height:1.45}
  .hist-l .hf-d ul{margin:3px 0 0;padding-left:18px}

  /* ---------- modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 10px;overflow:auto}
  .modal{background:#fff;border-radius:8px;width:min(980px,100%);box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .modal.sm{width:min(520px,100%)}
  .modal header{background:var(--azul);color:#fff;padding:10px 16px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center}
  .modal header h3{margin:0;font-size:16px}
  .modal header button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
  .modal .cont{padding:14px 16px}
  .modal footer{padding:10px 16px;border-top:1px solid #e5e7eb;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .modal footer .izq{margin-right:auto}
  .form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
  .form>*,.sub-grid>*{min-width:0}
  .form .c2{grid-column:span 2}.form .c4{grid-column:1/-1}
  .form label{display:block;font-size:11.5px;font-weight:700;color:var(--azul-osc);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
  .form input,.form select,.form textarea{width:100%;padding:7px 8px;border:1px solid var(--borde);border-radius:4px;background:#fff}
  .form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--azul);outline-offset:-1px}
  .form input[readonly]{background:#f3f4f6}
  .form .hint{font-size:11px;color:var(--muted)}
  .form fieldset{grid-column:1/-1;min-width:0;border:1px solid var(--gris);border-radius:6px;padding:10px;margin:0}
  .form legend{font-weight:700;color:var(--azul);padding:0 6px}
  .sub-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
  .picker{border:1px solid var(--borde);border-radius:4px;overflow:hidden;cursor:crosshair;background:#000}
  .picker-info{font-size:12px;color:var(--muted);margin-top:4px}

  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .foto{border:1px solid var(--gris);border-radius:6px;overflow:hidden;background:#fafafa;position:relative}
  .foto img{width:100%;height:120px;object-fit:cover;display:block;cursor:zoom-in;background:#ddd}
  .foto input{width:100%;border:0;border-top:1px solid var(--gris);padding:4px 6px;font-size:12px}
  .foto .x{position:absolute;top:4px;right:4px;background:rgba(192,0,0,.9);color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer;font-weight:700}
  .foto .pend{position:absolute;left:4px;top:4px;background:var(--amarillo);font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}
  .drop{border:2px dashed var(--azul);border-radius:6px;padding:14px;text-align:center;color:var(--azul);cursor:pointer;background:#f6f9fe}
  .drop.on{background:var(--azul-claro)}

  table.edit{border-collapse:collapse;width:100%;font-size:13px}
  table.edit th{background:var(--azul);color:#fff;padding:5px;font-size:12px}
  table.edit td{border:1px solid var(--gris);padding:3px}
  table.edit input,table.edit select{width:100%;border:1px solid transparent;padding:4px;background:transparent}
  table.edit input:focus{border-color:var(--azul);background:#fff}
  table.edit tr.reemp td{color:var(--muted);background:#f6f6f6}

  /* ---------- otros */
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:6px;z-index:80;box-shadow:var(--sombra);max-width:90vw}
  .toast.err{background:var(--rojo)}
  .cargando{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:700;color:var(--azul)}
  .spin{width:42px;height:42px;border:5px solid var(--azul-claro);border-top-color:var(--azul);border-radius:50%;animation:g 0.8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .visor{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:95;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
  .visor img{max-width:96vw;max-height:92vh}
  .vacio{padding:30px;text-align:center;color:var(--muted)}
  .muted{color:var(--muted)}

  @media (max-width:900px){
    .cab-grid{grid-template-columns:1fr}
    .form,.sub-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .hoja-tit{grid-template-columns:1fr}
    .hoja-tit .der,.hoja-tit .izq{display:none}
    .top h1 small{display:none}
    .logos-top{height:36px;padding:2px 6px}.logos-top img{height:28px}.top h1{font-size:14px}
  }
  @media (max-width:520px){ .form,.sub-grid{grid-template-columns:minmax(0,1fr)} .form .c2{grid-column:auto} main{padding:10px} }

  /* ---------- impresión: sólo la hoja */
  @media print{
    @page{size:letter landscape;margin:8mm}
    body{background:#fff}
    .top,.toolbar,.no-print,details.hist,.modal-bg,.toast{display:none!important}
    main{padding:0;max-width:none}
    .hoja{box-shadow:none;page-break-inside:auto}
    .tramo{page-break-inside:avoid;min-width:0}
    table.hall{min-width:0}
    .scroll-x{overflow:visible}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

</head>
<body>
  <div class="top">
    <span class="logos-top" id="logosTop" style="display:none"><img id="logoTop" alt="msmin by SGS"><img id="logoTop2" alt="CODELCO"></span>
    <h1>Mapeo de Sistemas Transportadores<small id="subTop">Cargando…</small></h1>
    <div class="sp"></div>
    <span class="chip-user" id="chipUser" title="Cambiar nombre del inspector">👤 —</span>
  </div>
  <main id="view"><div class="vacio">Cargando datos… <small>(si este texto no cambia en 10 segundos, el código App no se está ejecutando)</small></div></main>
  <div id="modalRoot"></div>
  <script>
var VERSION_APP = '1.0.2';
var CINTA_INICIAL = '';
try { document.getElementById('view').innerHTML = '<div class="vacio">Conectando con el servidor… (app v' + VERSION_APP + ')</div>'; } catch (e) {}

const SECC = 15;
const S = {
  init: null, data: null, filtro: '', critFiltro: '', mostrarCerrados: false,
  nombre: lsGet('mc_nombre') || ''
};


function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function esc(v){
  if(v===null||v===undefined) return '';
  return String(v).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;')
    .split(String.fromCharCode(34)).join('&quot;').split(String.fromCharCode(39)).join('&#39;');
}
function n(v){ if(v===null||v===undefined||v==='') return null; if(typeof v==='number') return v;
  let s=String(v).replace(/\s/g,''); if(/^\d+,\d+$/.test(s)) s=s.replace(',','.'); const m=s.replace(/,/g,'').match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }
function fmtF(s){ if(!s) return ''; const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m? `${m[3]}-${m[2]}-${m[1]}` : String(s); }
function fmtN(v,d=2){ const x=n(v); return x===null? '' : (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toLocaleString('es-CL'); }
function hoy(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function api(fn, ...args){
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e && e.message ? e : new Error(String(e))))[fn](...args);
  });
}
let cargas = 0;
function cargando(on, txt){
  cargas += on ? 1 : -1; if(cargas<0) cargas=0;
  let d = $('#cargando');
  if(cargas>0){ if(!d){ d=document.createElement('div'); d.id='cargando'; d.className='cargando'; d.innerHTML='<div class="spin"></div><div id="cargTxt"></div>'; document.body.appendChild(d); }
    $('#cargTxt').textContent = txt || 'Procesando…'; }
  else if(d) d.remove();
}
async function llamar(fn, args, txt){
  cargando(true, txt);
  try { return await api(fn, ...args); }
  catch(e){ toast(e.message || e, true); throw e; }
  finally { cargando(false); }
}
function toast(msg, err){
  const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), err?6000:3000);
}
function puedeEditar(){ return S.init && S.init.usuario.rol !== 'LECTOR'; }
function esAdmin(){ return S.init && S.init.usuario.rol === 'ADMIN'; }


function critColor(v){ const l=(S.init.listas.CRITICIDAD||[]).find(x=>x.valor===v); return l&&l.color ? l.color : '#FFFFFF'; }
function txtColor(bg){ const h=bg.replace('#',''); if(h.length<6) return '#000'; const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return (r*299+g*587+b*114)/1000 < 140 ? '#fff' : '#000'; }
function badge(v, extra=''){ const c=critColor(v); return `<span class="badge" style="background:${c};color:${txtColor(c)}">${esc(v)}${extra}</span>`; }
function opciones(lista, sel, vacia){
  const items=(S.init.listas[lista]||[]).map(x=>x.valor);
  if(sel && items.indexOf(sel)<0) items.push(sel);
  return (vacia?'<option value=""></option>':'') + items.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('');
}


function aMetros(txt, largoTramo){
  if(txt===null||txt===undefined||txt==='') return null;
  if(typeof txt==='number') return txt;
  const t=String(txt).toLowerCase();
  if(t.includes('desarrollo')||t.includes('todo')) return largoTramo;
  const v=n(txt); if(v===null) return null;
  if(/\bmm\b|mm$/.test(t)) return v/1000;
  if(/\bcm\b/.test(t)) return v/100;
  return v;
}
function ladoDesdeTexto(t){
  t=(t||'').toLowerCase();
  if(/ambos|ambas/.test(t)) return 'AMBOS';
  if(/derech|\bld\b/.test(t)) return 'DERECHO';
  if(/izq|\bli\b/.test(t)) return 'IZQUIERDO';
  if(/transversal/.test(t)) return 'TRANSVERSAL';
  return 'CENTRO';
}


function errorPantalla(msg){
  const v=document.getElementById('view');
  if(v) v.innerHTML = `<div class="vacio" style="color:#C00000"><b>Error al cargar la aplicación</b><br>${esc(msg)}<br><br>
    <span class="muted">Revise: 1) que ejecutó la función <b>instalar</b> en el editor, 2) que publicó una <b>versión nueva</b> de la implementación,
    3) ejecute la función <b>diagnostico</b> en el editor y revise el registro.</span></div>`;
}
window.addEventListener('error', e => errorPantalla(e.message || 'Error de script'));
window.addEventListener('unhandledrejection', e => errorPantalla((e.reason && e.reason.message) || String(e.reason)));
function arrancar(){ if(arrancar.hecho) return; arrancar.hecho=true; iniciar(); }
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', arrancar); else arrancar();
async function iniciar(){
  const aviso = setTimeout(()=>{ const v=$('#view'); if(v && !S.init) v.innerHTML='<div class="vacio">Cargando datos… (la primera carga puede tardar hasta 30 segundos)</div>'; }, 8000);
  try{
    S.init = await api('apiInit', S.nombre);
    if(!S.init || !S.init.usuario) throw new Error('El servidor no devolvió datos (apiInit vacío).');
  }catch(e){ clearTimeout(aviso); errorPantalla(e.message); return; }
  clearTimeout(aviso);
  const u=S.init.usuario;
  $('#subTop').textContent = (S.init.config.AREA_NOMBRE||'') + (S.init.config.EMPRESA? ' · '+S.init.config.EMPRESA : '') + ' · v' + VERSION_APP;

    if(S.init.logos.izq) $('#logoTop').src=S.init.logos.izq; else $('#logoTop').remove();
    if(S.init.logos.der) $('#logoTop2').src=S.init.logos.der; else $('#logoTop2').remove();
    $('#logosTop').style.display='';
  }
  pintarUsuario();
  $('#chipUser').onclick = pedirNombre;
  if(!u.email && !S.nombre) pedirNombre();
  google.script.url.getLocation(loc => {
    CINTA_INICIAL = (loc && loc.parameter && loc.parameter.cinta) || '';
    if(CINTA_INICIAL) abrirCinta(CINTA_INICIAL); else renderInicio();
  });
  window.addEventListener('popstate', ()=>{ if(S.data) { S.data=null; renderInicio(); } });
}
function pintarUsuario(){

function pedirNombre(){

/* ---------- Historial de cambios en palabras (el LOG guarda el detalle técnico en JSON) ---------- */
const HIST_ACC = { CAMBIO_TRAMO:'Cambio en tramos', EDITAR:'Edición', CREAR:'Nuevo', ELIMINAR:'Eliminado', IMAGEN:'Imagen', FOTO:'Foto',
  INFORME:'Informe', INFORME_PDF:'PDF descargado', CERRAR:'Cierre', INSTALAR:'Instalación' };
const HIST_ENT = { CINTA:'ficha de la cinta', TRAMO:'tramo', HALLAZGO:'hallazgo', FOTO:'foto' };
const HIST_CAMPOS = { N_TRAMO:'N° tramo', METROS:'metros', FECHA_INSERCION:'fecha de inserción', MEDIDA_INSERTADO_M:'medida insertada (m)', ESTADO:'estado',
  OBS:'observación', DETALLE:'detalle', CRITICIDAD:'criticidad', TIPO_REPARACION:'reparación', MARCA:'marca', ULTIMO_CAMBIO:'último cambio' };
function histFecha(v){ const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m? m[3]+'-'+m[2]+'-'+m[1] : String(v||''); }
/* Fecha del LOG en cualquiera de sus formatos (2026-10-16 17:32 · 16/10/2026 14:04:26 · 09-10-2026T17:17) → texto y clave para ordenar */
function histCuando(v){
  const t=String(v||''); let m=t.match(/^(\d{4})-(\d{2})-(\d{2})[T ]?(\d{1,2}:\d{2})?/), d,mo,a,hh;
  if(m){ a=m[1]; mo=m[2]; d=m[3]; hh=m[4]||''; }
  else if((m=t.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})[T ]?(\d{1,2}:\d{2})?/))){ d=('0'+m[1]).slice(-2); mo=('0'+m[2]).slice(-2); a=m[3]; hh=m[4]||''; }
  else return { txt:t, key:'' };
  if(hh) hh=('0'+hh).slice(-5);
  return { txt: d+'-'+mo+'-'+a+(hh?' '+hh:''), key: a+mo+d+hh };
}
function histQuien(u){ u=String(u||''); return u.includes('@') ? u.split('@')[0] : (u||'—'); }
function histDetalle(h){
  const t=String(h.DETALLE||'').trim();
  let o=null; if(/^[\[{]/.test(t)){ try{ o=JSON.parse(t); }catch(e){} }
  if(!o) return esc(t);
  if(h.ACCION==='CAMBIO_TRAMO'){
    const tipo={CINTA:'Cambio de cinta completa',REEMPLAZO:'Reemplazo de tramo',NUEVO:'Tramo nuevo',UNIR:'Unión de tramos',DIVIDIR:'División de tramo'}[o.tipo]||o.tipo;
    const res=(o.resumen||[]).map(x=>String(x).replace(/^Mapeo:\s*/,'')).filter(x=>x.toLowerCase()!==String(tipo).toLowerCase());
    return `<b>${esc(tipo)}</b>${o.fecha?' del '+esc(histFecha(o.fecha)):''}${res.length?'<ul>'+res.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}`;
  }
  const d = o.despues || o;
  const partes = Object.keys(HIST_CAMPOS).filter(k=>d[k]!==undefined && d[k]!==null && d[k]!=='').map(k=>HIST_CAMPOS[k]+': '+esc(/FECHA/.test(k)?histFecha(d[k]):d[k]));
  return partes.length ? partes.join(' · ') : '';
}
function histFila(h){
  const esCinta = h.ACCION==='CAMBIO_TRAMO' && /"tipo"\s*:\s*"CINTA"/.test(String(h.DETALLE||''));
  const acc = esCinta ? 'Cambio de cinta' : (HIST_ACC[h.ACCION] || String(h.ACCION||'').toLowerCase());
  const ent = esCinta ? '' : (HIST_ENT[h.ENTIDAD] || String(h.ENTIDAD||'').toLowerCase());
  const det = histDetalle(h);
  return `<div class="hf"><div class="hf-c"><b>${esc(acc)}</b> <span>${esc(ent)}</span><small>${esc(histCuando(h.FECHA).txt)} · ${esc(histQuien(h.USUARIO))}</small></div>${det?`<div class="hf-d">${det}</div>`:''}</div>`;
}

function htmlTramo(t, hs){
  const L=n(t.METROS);
  const empH = hs.filter(h=>h.UBICACION_TIPO==='EMPALME' && +h.UBICACION_N===+t.N_TRAMO);
  const tramoH = hs.filter(h=>h.UBICACION_TIPO!=='EMPALME' && +h.UBICACION_N===+t.N_TRAMO);
  const peorEmp = empH.sort((a,b)=>critPeso(b.CRITICIDAD)-critPeso(a.CRITICIDAD))[0];
  const secc = L? (L/SECC) : null;
  const med = n(t.MEDIDA_INSERTADO_M);
  return `<div class="tramo">
   <table>
    <colgroup><col style="width:90px">${'<col>'.repeat(SECC)}</colgroup>
    <tr><th rowspan="2">EMPALME</th>${Array.from({length:SECC},(_,i)=>`<th>SECCION ${i+1} [mt]</th>`).join('')}</tr>
    <tr>${Array.from({length:SECC},()=>`<th>${secc!==null?secc.toFixed(2):'—'}</th>`).join('')}</tr>
    <tr><td class="emp" ${peorEmp?`style="background:${critColor(peorEmp.CRITICIDAD)};color:${txtColor(critColor(peorEmp.CRITICIDAD))};cursor:pointer" data-hid="${esc(peorEmp.ID_HALLAZGO)}" title="${esc(empH.map(h=>'ID '+h.N_ID+': '+h.DETALLE).join('\n'))}"`:''}>
          ${esc(t.N_TRAMO)}${empH.length?`<br><small>ID ${empH.map(h=>h.N_ID).join(',')}</small>`:''}</td>
        <td class="banda" colspan="${SECC}">${svgBanda(L, tramoH, {})}</td></tr>
    <tr><td class="ins">Tramo insertado</td><td class="insbar" colspan="${SECC}">${barraInsercion(L, med, t.FECHA_INSERCION)}</td></tr>
   </table>
   ${!L?'<div class="muted" style="font-size:12px">⚠ Largo del tramo no definido: las marcas se muestran al inicio. Complete los metros en “Tramos”.</div>':''}
  </div>`;
}
function critPeso(v){ return ({CRITICA:5,MEDIA:4,LEVE:3,REPARADA:2,BUENA:1})[v]||0; }
const BANDAS = { IZQUIERDO:[0], CENTRO:[1], DERECHO:[2], AMBOS:[0,2], TRANSVERSAL:[0,1,2] };


function svgBanda(L, hs, opts){
  const W=1500, H=78, top=4, bh=(H-2*top)/3;
  let s = `<div style="position:relative">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:100%;height:${opts.alto||78}px">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#000"/>
    <line x1="0" y1="${top}" x2="${W}" y2="${top}" stroke="#8C96A3" stroke-width="2"/>
    <line x1="0" y1="${H-top}" x2="${W}" y2="${H-top}" stroke="#8C96A3" stroke-width="2"/>
    ${Array.from({length:SECC-1},(_,i)=>`<line x1="${(i+1)*100}" y1="${top}" x2="${(i+1)*100}" y2="${H-top}" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>`).join('')}
    <line x1="0" y1="${top+bh}" x2="${W}" y2="${top+bh}" stroke="#222" stroke-width="1"/>
    <line x1="0" y1="${top+2*bh}" x2="${W}" y2="${top+2*bh}" stroke="#222" stroke-width="1"/>`;
  const etiquetas=[];
  const lista = hs.slice();
  if(opts.preview) lista.push(Object.assign({_prev:true}, opts.preview));
  lista.forEach(h=>{
    const pos=n(h.POS_M)||0, ext=n(h.EXT_M)||0;
    const x = L ? Math.max(0, Math.min(W, pos/L*W)) : 0;
    let w = L ? ext/L*W : 0; w = Math.max(w, 7); if(x+w>W) w=Math.max(7, W-x);
    const col = h._prev ? '#00E5FF' : critColor(h.CRITICIDAD);
    const filas = BANDAS[h.LADO] || [1];
    s += `<g class="mk" ${h._prev?'':`data-hid="${esc(h.ID_HALLAZGO)}"`}><title>ID ${esc(h.N_ID||'nuevo')} · ${esc(h.DETALLE||'')} · ${esc(h.CRITICIDAD||'')}\nPos: ${fmtN(pos)} m · Largo: ${fmtN(ext,3)} m · ${esc(h.LADO||'')}</title>`;
    filas.forEach(f=>{ s+=`<rect x="${x}" y="${top+f*bh+2}" width="${w}" height="${bh-4}" fill="${col}" stroke="${h._prev?'#fff':'#fff'}" stroke-width="${h._prev?2:1}"/>`; });
    s += `</g>`;
    etiquetas.push({x:x/W*100, f:filas[0], id:h.N_ID||'＋', hid:h._prev?'':h.ID_HALLAZGO, col});
  });
  s += `</svg>`;
  etiquetas.forEach(e=>{
    const topPx = (top + e.f*bh) * ((opts.alto||78)/H);
    s += `<span ${e.hid?`data-hid="${esc(e.hid)}"`:''} style="position:absolute;left:calc(${Math.min(e.x,97)}% + 2px);top:${topPx-1}px;background:#fff;border:2px solid ${e.col};border-radius:9px;font:700 10px/1 Calibri,Arial;padding:2px 5px;cursor:pointer;white-space:nowrap;pointer-events:${e.hid?'auto':'none'}">ID ${esc(e.id)}</span>`;
  });
  return s + `</div>`;
}
function barraInsercion(L, med, fecha){
  if(!med && !fecha) return '';
  const w = (L && med) ? Math.min(100, med/L*100) : 0;
  return `<div style="position:relative;height:20px">${w?`<div style="position:absolute;left:0;top:0;bottom:0;width:${w}%;background:#BFBFBF"></div>`:''}
    <span style="position:absolute;left:6px;top:3px;font-size:11px;font-weight:700">${med?'Insertado ':'Inserción '}${fmtF(fecha)}${med?' · '+fmtN(med)+' m':''}</span></div>`;
}


function modal({titulo, cuerpo, botones=[], sm=false, onOpen, izquierda}){
  const root=$('#modalRoot');
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = `<div class="modal ${sm?'sm':''}"><header><h3>${titulo}</h3><button data-x>×</button></header>
    <div class="cont">${cuerpo}</div><footer>${izquierda?'<span class="izq"></span>':''}</footer></div>`;
  root.appendChild(bg);
  const cerrar=()=>bg.remove();
  bg.querySelector('[data-x]').onclick=cerrar;
  bg.addEventListener('mousedown', e=>{ if(e.target===bg) bg._down=true; });
  bg.addEventListener('mouseup', e=>{ if(e.target===bg && bg._down) cerrar(); bg._down=false; });
  const foot=bg.querySelector('footer');
  if(izquierda){ const sp=foot.querySelector('.izq'); izquierda.forEach(b=>sp.appendChild(boton(b,cerrar))); }
  botones.forEach(b=>foot.appendChild(boton(b,cerrar)));
  if(onOpen) onOpen(bg, cerrar);
  return {bg, cerrar};
}
function boton(b, cerrar){
  const e=document.createElement('button'); e.className='btn'+(b.pri?' pri':'')+(b.peligro?' peligro':''); e.textContent=b.txt;
  e.onclick=()=> b.fn ? b.fn(cerrar, e) : cerrar(); return e;
}
function leerForm(root){
  const o={}; $$('[name]', root).forEach(i=>{ o[i.name] = i.type==='checkbox' ? i.checked : i.value.trim(); }); return o;
}

        ['UBICACION_N','UBICACION_TIPO','CRITICIDAD'].forEach(k=>f(k).addEventListener('change',auto));
        f('POS_M').addEventListener('input',()=>{posManual=true;pintarPicker();});
        f('EXT_M').addEventListener('input',()=>{extManual=true;pintarPicker();});
        f('LADO').addEventListener('change',()=>{ladoManual=true;pintarPicker();});
        $('#picker',bg).addEventListener('click', ev=>{
          const o=actual(); if(o.UBICACION_TIPO==='EMPALME') return;
          const svg=$('#picker svg',bg); if(!svg) return;
          const r=svg.getBoundingClientRect(); const fx=(ev.clientX-r.left)/r.width, fy=(ev.clientY-r.top)/r.height;
          const L=largoDe(o.UBICACION_N);
          if(L){ f('POS_M').value = Math.round(fx*L*100)/100; posManual=true; }
          else toast('Defina el largo del tramo para ubicar por posición', true);
          f('LADO').value = fy<0.36?'IZQUIERDO':(fy>0.64?'DERECHO':'CENTRO'); ladoManual=true;
          pintarPicker();
        });

        const drop=$('#dropF',bg), inp=$('#fileF',bg);
        drop.onclick=()=>inp.click();
        ['dragover','dragenter'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('on');}));
        ['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('on');}));
        drop.addEventListener('drop', x=>agregarFotos(x.dataTransfer.files));
        inp.onchange=()=>{ agregarFotos(inp.files); inp.value=''; };
      }
      pintarPicker();
      async function agregarFotos(files){
        for(const file of Array.from(files)){
          if(String(file.type).indexOf('image')!==0) continue;
          try{
            const dataUrl=await redimensionar(file,1600,0.82), miniDataUrl=await redimensionar(file,900,0.75);
            pendientes.push({dataUrl, miniDataUrl, nombre:file.name, descripcion:''});
          }catch(e){ toast('No se pudo leer '+file.name, true); }
        }
        pintarGaleria();
      }
      bg._agregarFotos=agregarFotos;
    }
  });
  const bg=m.bg;
  let existentes=[];
  function pintarGaleria(){
    const g=$('#gal',bg);
    g.innerHTML = existentes.map(fo=>`<div class="foto" data-f="${esc(fo.ID_FOTO)}">
        <img src="${fo.mini||''}" data-full="${esc(fo.ID_FOTO)}" alt="">
        ${ed?`<button class="x" data-del="${esc(fo.ID_FOTO)}" title="Eliminar">×</button>`:''}
        <input value="${esc(fo.DESCRIPCION)}" placeholder="Descripción" data-desc="${esc(fo.ID_FOTO)}" ${ed?'':'readonly'}></div>`).join('')
      + pendientes.map((p,i)=>`<div class="foto"><span class="pend">Pendiente</span><img src="${p.miniDataUrl}" alt="">
        <button class="x" data-pdel="${i}">×</button><input value="${esc(p.descripcion)}" placeholder="Descripción" data-pdesc="${i}"></div>`).join('')
      || '<div class="muted">Sin fotos</div>';
    $$('[data-full]',g).forEach(im=>im.onclick=async()=>{ const full=await llamar('apiGetFotoFull',[im.dataset.full],'Abriendo foto…'); visor(full||im.src); });
    $$('[data-del]',g).forEach(b=>b.onclick=async()=>{ if(!confirm('¿Eliminar la foto?')) return;
      await llamar('apiDeleteFoto',[b.dataset.del,S.nombre],'Eliminando foto…'); existentes=existentes.filter(x=>x.ID_FOTO!==b.dataset.del); pintarGaleria(); h.nFotos=existentes.length; });
    $$('[data-desc]',g).forEach(i=>i.onchange=()=>api('apiUpdateFoto',i.dataset.desc,i.value,S.nombre).then(()=>toast('Descripción guardada')).catch(e=>toast(e.message,true)));
    $$('[data-pdel]',g).forEach(b=>b.onclick=()=>{ pendientes.splice(+b.dataset.pdel,1); pintarGaleria(); });
    $$('[data-pdesc]',g).forEach(i=>i.oninput=()=>{ pendientes[+i.dataset.pdesc].descripcion=i.value; });
  }
  if(!nuevo){ api('apiGetFotos', h.ID_HALLAZGO).then(fs=>{ existentes=fs; pintarGaleria(); }).catch(e=>{ $('#gal',bg).innerHTML='<div class="muted">Error: '+esc(e.message)+'</div>'; }); }
  else pintarGaleria();

  async function guardar(cerrar, btn){
    const o=leerForm(bg);
    if(!o.DETALLE){ toast('Describa el daño (Detalle daño)', true); return; }
    o.ID_CINTA=S.data.cinta.ID_CINTA; if(!nuevo) o.ID_HALLAZGO=h.ID_HALLAZGO;
    btn.disabled=true;
    try{
      const id=await llamar('apiSaveHallazgo',[o,S.nombre],'Guardando hallazgo…');
      for(let i=0;i<pendientes.length;i++){
        await llamar('apiUploadFoto',[id,pendientes[i],S.nombre],`Subiendo foto ${i+1} de ${pendientes.length}…`);
      }
      cerrar(); toast('Hallazgo guardado'+(pendientes.length?` con ${pendientes.length} foto(s)`:'')); refrescar();
    }catch(e){ btn.disabled=false; }
  }
}


function modalInforme(){
  const c=S.data.cinta;
  modal({ titulo:'Informe de salida – '+esc(c.CODIGO), sm:true, cuerpo:`
    <p>Se descargará el PDF de <b>${esc(c.CODIGO)}</b> con el formato de la planilla oficial:
    ficha técnica, detalle de hallazgos y diagrama por tramo. No se guarda ningún archivo en Drive.</p>
    <div class="form"><div class="c4"><label style="text-transform:none;font-weight:400"><input type="checkbox" id="chkFotos" style="width:auto"> Incluir registro fotográfico (páginas adicionales)</label></div></div>
    <div id="resInf"></div>`,
    botones:[{txt:'Cerrar'},{txt:'⬇ Descargar PDF', pri:true, fn: async(cerrar, btn)=>{
      btn.disabled=true;
      try{
        const r=await llamar('apiDescargarPdf',[c.ID_CINTA,$('#chkFotos').checked,S.nombre],'Generando PDF… (puede tardar unos segundos)');
        const url=descargarBase64(r.base64, r.nombre, 'application/pdf');
        $('#resInf').innerHTML = `<p>✅ PDF listo. Si no se descargó solo, <a href="${url}" target="_blank" download="${esc(r.nombre)}">haga clic aquí</a>.</p>`;
      }finally{ btn.disabled=false; }
    }}]
  });
}

function descargarBase64(b64, nombre, tipo){
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([bytes],{type:tipo}));
  const a=document.createElement('a'); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
  return url;
}


function redimensionar(file, maxLado, calidad){
  return new Promise((res, rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const k=Math.min(1, maxLado/Math.max(img.naturalWidth, img.naturalHeight));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
      const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', calidad));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Imagen no válida')); };
    img.src=url;
  });
}
function visor(src){
  const v=document.createElement('div'); v.className='visor'; v.innerHTML=`<img src="${src}">`; v.onclick=()=>v.remove(); document.body.appendChild(v);
}
</script>

    window.PUENTE_DESPUES_SYNC = function () {
      try { if (typeof S !== "undefined" && S.data) refrescar(); else if (typeof recargarInit === "function") recargarInit().then(function () { if (typeof renderInicio === "function") renderInicio(); }); } catch (e) { }
    };
    // Llegaron datos más nuevos que la copia del teléfono: se vuelve a pintar (sin tocar lo que se está editando).
    window.PUENTE_DATOS_NUEVOS = function (fn) {
      // El rol y las listas siempre se actualizan (aunque haya una ficha o una ventana abierta)
      if (fn === "apiInit" && typeof recargarInit === "function") {
        recargarInit().then(function () {
          if (document.querySelector(".modal-bg")) return;
          try { if (typeof S !== "undefined" && S.data) renderCinta(); else if (typeof renderInicio === "function") renderInicio(); } catch (e) { }
        }, function () { });
        return;
      }
      if (document.querySelector(".modal-bg")) return;
      if (fn === "apiGetCinta") window.PUENTE_DESPUES_SYNC();
    };
  </script>

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { }); });
    }
