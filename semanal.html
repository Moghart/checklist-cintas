<style>
  :root { --azul:#1F3864; --azul2:#2F5597; --gris:#f2f4f8; --borde:#d5dae3; --texto:#1c2430; --suave:#667085;
          --alta:#FF0000; --media:#FFFF00; --baja:#00B050; --critica:#000000; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; font-size:15px; color:var(--texto); background:var(--gris); }
  header { background:var(--azul); color:#fff; padding:10px 12px; position:sticky; top:0; z-index:20; }
  .fila-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; max-width:1200px; margin:0 auto; }
  h1 { font-size:16px; margin:0; flex:1 1 180px; line-height:1.2; }
  h1 small { display:block; font-weight:normal; font-size:12px; opacity:.85; }
  .semana { display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.14); border-radius:8px; padding:4px 6px; }
  .semana label { font-size:12px; }
  .semana input { width:58px; padding:6px 4px; border:0; border-radius:6px; font-size:15px; text-align:center; }
  .semana input.anio { width:66px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:9px 12px; }
  .btn { background:#fff; color:var(--azul); font-weight:bold; }
  .btn-sec { background:#e8ecf4; color:var(--azul); }
  .btn-flecha { background:transparent; color:#fff; padding:6px 8px; font-size:16px; }
  button:disabled { opacity:.5; cursor:default; }
  #estado { font-size:12px; padding:5px 9px; border-radius:20px; background:#2e7d32; color:#fff; white-space:nowrap; }
  #estado.off { background:#b26a00; } #estado.pend { background:#b26a00; }
  nav { display:flex; max-width:1200px; margin:8px auto 0; gap:4px; }
  nav button { flex:1; background:rgba(255,255,255,.14); color:#fff; padding:9px 2px; font-size:13px; border-radius:8px 8px 0 0; }
  nav button.activa { background:var(--gris); color:var(--azul); font-weight:bold; }
  main { max-width:1200px; margin:0 auto; padding:10px; }
  .aviso { background:#fff4d6; border:1px solid #e6c35c; border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:13px; }
  .resumen { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; font-size:13px; align-items:center; }
  .chip { display:inline-block; min-width:64px; text-align:center; padding:3px 8px; border-radius:6px; font-weight:bold; font-size:12px; border:1px solid #9aa3b2; background:#fff; color:#555; }
  .p-ALTA { background:var(--alta); color:#fff; border-color:var(--alta); }
  .p-MEDIA { background:var(--media); color:#000; border-color:#c9c900; }
  .p-BAJA { background:var(--baja); color:#fff; border-color:var(--baja); }
  .p-CRITICA { background:var(--critica); color:#fff; border-color:#000; }
  .tarjeta { background:#fff; border:1px solid var(--borde); border-radius:10px; margin-bottom:8px; overflow:hidden; }
  .cab { display:flex; align-items:center; gap:8px; padding:10px; cursor:pointer; }
  .cab .n { width:26px; color:var(--suave); font-size:13px; text-align:right; }
  .cab .tag { font-weight:bold; font-size:16px; flex:1; }
  .cab .nota { font-size:12px; color:var(--suave); }
  .cab .flecha { color:var(--suave); }
  .cuerpo { display:none; padding:0 10px 12px; border-top:1px solid var(--borde); }
  .tarjeta.abierta .cuerpo { display:block; }
  .campo { margin-top:10px; }
  .campo > label { display:block; font-size:12px; font-weight:bold; color:var(--azul); margin-bottom:4px; text-transform:uppercase; }
  .campo .origen { font-weight:normal; text-transform:none; color:var(--suave); }
  textarea, input[type=text] { width:100%; font:inherit; padding:8px; border:1px solid #b9c0cc; border-radius:8px; background:#fffef2; }
  textarea { min-height:70px; resize:vertical; }
  .auto { background:#eef3fb; border:1px solid #c8d5ea; border-radius:8px; padding:8px; white-space:pre-wrap; font-size:14px; min-height:36px; }
  .prio { display:flex; gap:6px; flex-wrap:wrap; }
  .prio button { flex:1 1 70px; padding:10px 4px; font-weight:bold; background:#fff; color:#555; border:2px solid #b9c0cc; }
  .prio button.sel.ALTA { background:var(--alta); color:#fff; border-color:var(--alta); }
  .prio button.sel.MEDIA { background:var(--media); color:#000; border-color:#c9c900; }
  .prio button.sel.BAJA { background:var(--baja); color:#fff; border-color:var(--baja); }
  .prio button.sel.CRITICA { background:var(--critica); color:#fff; border-color:#000; }
  .rejilla { display:grid; grid-template-columns:1fr; gap:0 12px; }
  @media (min-width:800px) { .rejilla { grid-template-columns:1fr 1fr 1fr; } .dos { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; } }
  .fotos { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  @media (max-width:520px) { .fotos { grid-template-columns:repeat(2, 1fr); } }
  .foto { position:relative; aspect-ratio:4/3; background:#e9edf3; border:1px solid var(--borde); border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--suave); }
  .foto img { width:100%; height:100%; object-fit:contain; background:#fff; }
  .foto .quitar { position:absolute; top:3px; right:3px; background:rgba(0,0,0,.65); color:#fff; border-radius:50%; width:26px; height:26px; padding:0; line-height:26px; }
  .acciones { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .tabla-wrap { overflow:auto; background:#fff; border:1px solid var(--borde); border-radius:10px; max-height:75vh; }
  table.est { border-collapse:collapse; font-size:12px; }
  table.est th, table.est td { border:1px solid #c5cbd6; padding:4px 2px; text-align:center; min-width:30px; height:26px; }
  table.est th { background:var(--azul); color:#fff; position:sticky; top:0; z-index:2; }
  table.est td.tag, table.est th.tag { position:sticky; left:0; background:#fff; color:var(--texto); font-weight:bold; min-width:84px; z-index:1; }
  table.est th.tag { background:var(--azul); color:#fff; z-index:3; }
  table.est .actual { outline:2px solid var(--azul2); outline-offset:-2px; }
  #velo { position:fixed; inset:0; background:rgba(20,30,50,.55); color:#fff; display:flex; align-items:center; justify-content:center; z-index:50; text-align:center; padding:20px; font-size:16px; }
  #velo.oculto { display:none; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:20px; font-size:14px; z-index:60; display:none; max-width:90%; }
  @media (max-width:700px) { header { position:static; } }
  .panel { background:#fff; border:1px solid var(--borde); border-radius:10px; padding:12px; margin-bottom:8px; }
  .btn-azul { background:var(--azul); color:#fff; font-weight:bold; }
  .nota { font-size:12px; color:var(--suave); }
  table.hist { border-collapse:collapse; width:100%; font-size:13px; }
  table.hist th { background:var(--azul); color:#fff; padding:6px; border:1px solid #c5cbd6; position:sticky; top:0; }
  table.hist td { padding:6px; border:1px solid #d5dae3; text-align:center; white-space:nowrap; }
  table.hist td button { padding:6px 9px; }
  .peor { color:#c00000; font-weight:bold; } .mejor { color:#00803c; font-weight:bold; }
  select { font:inherit; padding:8px; border:1px solid #b9c0cc; border-radius:8px; background:#fff; }
  .oculto { display:none !important; }
  .leyenda span { margin-right:4px; }
  .imp-in { width:72px; padding:6px; border:1px solid #b9c0cc; border-radius:6px; font:inherit; }
  td.mini { white-space:normal; text-align:left; }
  td.mini img { height:46px; margin:1px 3px 1px 0; border-radius:4px; border:1px solid #c5cbd6; vertical-align:middle; }
</style>
</head>

      'Se traspasan prioridades, descripciones, fechas, recomendaciones, causas, comentarios, las fotos de cada equipo y la tabla de estadísticas. Antes de enviar se muestra una vista previa.</div>' +
      '<div class="acciones"><button type="button" class="btn-azul" data-acc="impElegir">Elegir archivo(s) Excel</button></div>';
    if (!importacion) return h + '</div>';
    var guardadas = {}; (reportes || []).forEach(function (r) { guardadas[r.anio + '|' + r.semana] = true; });
    var validos = 0;
    importacion.archivos.forEach(function (a, i) {
      h += '<div style="border-top:1px solid var(--borde);margin-top:10px;padding-top:8px"><b>' + esc(a.nombre) + '</b>';
      if (a.error) { h += '<div class="aviso" style="margin-top:6px">No se puede importar: ' + esc(a.error) + '</div></div>'; return; }
      validos++;
      var cc = { CRITICA: 0, ALTA: 0, MEDIA: 0, BAJA: 0 }, cf = { CRITICA: 0, ALTA: 0, MEDIA: 0, BAJA: 0 };
      Object.keys(a.cintas).forEach(function (t) { if (cc[a.cintas[t].prioridad] !== undefined) cc[a.cintas[t].prioridad]++; });
      Object.keys(a.focos).forEach(function (t) { if (cf[a.focos[t].prioridad] !== undefined) cf[a.focos[t].prioridad]++; });
      h += '<div class="acciones" style="align-items:center">Semana <input class="imp-in" type="number" min="1" max="53" data-imp="semana" data-i="' + i + '" value="' + (a.semana || '') + '">' +
           ' Año <input class="imp-in" type="number" min="2020" max="2100" data-imp="anio" data-i="' + i + '" value="' + (a.anio || '') + '">' +
           (!a.semana ? ' <span class="peor">indique la semana</span>' : (guardadas[a.anio + '|' + a.semana] ? ' <span class="peor">ya existe un reporte de esa semana: se reemplazará</span>' : '')) + '</div>' +
           '<div class="resumen" style="margin:6px 0 0">Cintas: ' + Object.keys(a.cintas).length + ' equipos ' + chipsCuenta(cc) + ' · Aseo: ' + Object.keys(a.focos).length + ' equipos ' + chipsCuenta(cf) +
           ' · Fotos: ' + a.nFotos + ' · Estadísticas: ' + a.est.length + ' celdas</div>';
      a.avisos.forEach(function (x) { h += '<div class="aviso" style="margin:6px 0 0">' + esc(x) + '</div>'; });
      h += '<details style="margin-top:6px"><summary class="nota" style="cursor:pointer">Ver detalle por equipo</summary><div class="tabla-wrap" style="margin-top:6px"><table class="hist"><tr><th>Equipo</th><th>Cinta</th><th>Fotos cinta</th><th>Aseo</th><th>Fotos aseo</th></tr>';
      EQUIPOS_BASE.forEach(function (e) {
        var c = a.cintas[e[1]], f = a.focos[e[1]];
        if (!c && !f) return;
        function mini(l) { return (l || []).map(function (d) { return '<img src="' + d + '" alt="">'; }).join(''); }
        h += '<tr><td><b>' + e[1] + '</b></td><td>' + (c ? chip(c.prioridad) : '—') + '</td><td class="mini">' + (c ? mini(c.fotos) : '') + '</td><td>' + (f ? chip(f.prioridad) : '—') + '</td><td class="mini">' + (f ? mini(f.fotos) : '') + '</td></tr>';
      });
      h += '</table></div></details></div>';
    });
    h += '<div style="border-top:1px solid var(--borde);margin-top:10px;padding-top:8px"><label class="nota"><input type="checkbox" data-imp="est"' + (importacion.sobrescribirEst ? ' checked' : '') + '> ' +
         'Reemplazar en Estadísticas las letras que ya existan en la app (si no se marca, solo se llenan las semanas vacías)</label>' +
         '<div class="acciones">' + (validos ? '<button type="button" class="btn-azul" data-acc="impConfirmar">Importar ' + validos + ' reporte' + (validos > 1 ? 's' : '') + '</button>' : '') +
         '<button type="button" class="btn-sec" data-acc="impCancelar">Cancelar</button></div>' +
         '<div class="nota" style="margin-top:4px">Se necesita conexión. Si se interrumpe, puede volver a importar el mismo archivo: los datos se reemplazan, no se duplican.</div></div>';
    return h + '</div>';
  }

  function enParalelo(tareas, n) {
    var i = 0;
    function sig() { if (i >= tareas.length) return Promise.resolve(); var t = tareas[i++]; return t().then(sig); }
    var hilos = []; for (var k = 0; k < Math.min(n, tareas.length); k++) hilos.push(sig());
    return Promise.all(hilos);
  }

  function ejecutarImportacion() {
    if (!navigator.onLine) { toast('Para importar se necesita conexión.'); return; }
    var archivos = importacion.archivos.filter(function (a) { return !a.error; }), vistas = {};
    for (var i = 0; i < archivos.length; i++) {
      var a = archivos[i];
      if (!(a.anio > 2000) || !(a.semana >= 1 && a.semana <= 53)) { toast('Revise la semana y el año de ' + a.nombre + '.', 6000); return; }
      if (vistas[a.anio + '|' + a.semana]) { toast('Dos archivos son de la semana ' + a.semana + ' de ' + a.anio + '. Corrija uno o quítelo.', 6000); return; }
      vistas[a.anio + '|' + a.semana] = true;
    }
    archivos.sort(function (x, y) { return (x.anio * 100 + x.semana) - (y.anio * 100 + y.semana); });
    var total = 1, hechos = 0;
    archivos.forEach(function (a) { total += Object.keys(a.cintas).length + Object.keys(a.focos).length + 1; });
    function paso(t) { velo('Importando ' + t + '… ' + Math.round(hechos * 100 / total) + '% — no cierre esta ventana'); }
    function guardarImgs(datos, urls) { (urls || []).forEach(function (u, k) { if (u && datos[k]) { imgCache[u] = datos[k]; localPut('img', datos[k], u); } }); }
    function revisar(r, que) { if (!r || !r.exito) throw new Error(que + ': ' + ((r && r.error) || 'error')); return r; }
    var cadena = Promise.resolve();
    archivos.forEach(function (a) {
      var fuente = 'Importado de Excel ' + a.nombre;
      cadena = cadena.then(function () {
        var tareas = [];
        Object.keys(a.cintas).forEach(function (tag) {
          var c = a.cintas[tag];
          tareas.push(function () {
            paso('S' + a.semana + ' ' + a.anio + ' · cinta ' + tag);
            return llamar('guardarCinta', { anio: a.anio, semana: a.semana, tag: tag, prioridad: c.prioridad, descripcion: c.descripcion, fechaCambio: c.fechaCambio, proyeccion: c.proyeccion,
                                            medida: c.medida, recomendacion: c.recomendacion, fotos: [], fotosPropias: c.fotos, fuente: fuente })
              .then(function (r) { revisar(r, 'cinta ' + tag); c.urls = r.fotos || []; guardarImgs(c.fotos, c.urls); hechos++; });
          });
        });
        Object.keys(a.focos).forEach(function (tag) {
          var f = a.focos[tag];
          tareas.push(function () {
            paso('S' + a.semana + ' ' + a.anio + ' · aseo ' + tag);
            return llamar('guardarFoco', { anio: a.anio, semana: a.semana, tag: tag, prioridad: f.prioridad, descripcion: f.descripcion, causa: f.causa, comentarios: f.comentarios, fotos: f.fotos })
              .then(function (r) { revisar(r, 'aseo ' + tag); guardarImgs(f.fotos, r.fotos); hechos++; });
          });
        });
        return enParalelo(tareas, 3).then(function () {
          paso('S' + a.semana + ' ' + a.anio + ' · registro del reporte');
          var filas = Object.keys(a.cintas).map(function (tag) {
            var c = a.cintas[tag];
            return { tag: tag, prioridad: c.prioridad, descripcion: c.descripcion, fechaCambio: c.fechaCambio, proyeccion: c.proyeccion, medida: c.medida, recomendacion: c.recomendacion, fotos: [], fotosPropias: c.urls || [], fuente: fuente };
          });
          return filas.length ? llamar('semGuardarReporte', { anio: a.anio, semana: a.semana, cintas: filas }).then(function (r) { revisar(r, 'reporte S' + a.semana); }) : null;
        }).then(function () { hechos++; localDel('cache', 'sem|' + a.anio + '|' + a.semana); });
      });
    });
    var nEst = 0;
    cadena.then(function () {
      var mapa = {};
      archivos.forEach(function (a) { a.est.forEach(function (x) { var an = x[0] || a.anio; mapa[an + '|' + x[1] + '|' + x[2]] = [an, x[1], x[2], x[3]]; }); });
      var celdas = Object.keys(mapa).map(function (k) { return mapa[k]; });
      if (!celdas.length) return;
      paso('estadísticas');
      return llamar('importarEstadisticas', { celdas: celdas, sobrescribir: importacion.sobrescribirEst }).then(function (r) { revisar(r, 'estadísticas'); nEst = r.celdas || 0; });
    }).then(function () {
      velo('');
      var n = archivos.length;
      importacion = null; reportes = null; reportesLeidos = 0;
      return cargar(D.anio, D.semana, true).then(function () {
        toast('Importación lista: ' + n + ' reporte' + (n > 1 ? 's' : '') + ' con sus fotos' + (nEst ? ' y ' + nEst + ' celdas de estadísticas' : '') + '. Use "Ver" en la lista para revisarlos.', 8000);
      });
    }).catch(function (e) {
      velo('');
      toast('La importación se detuvo (' + ((e && e.message) || e) + '). Puede volver a importar: lo ya cargado se reemplaza, no se duplica.', 10000);
    });
  }

  /* ---------------- inicio ---------------- */
  abrirLocal().then(function () { var hoy = new Date(); return cargar(hoy.getFullYear(), semanaDe(hoy)); });
})();
</script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { }); });
    }
  </script>
